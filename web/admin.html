<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pannello Pagamenti — Sci Club Don Bosco</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="brand.css">
  <style>
    .container-main { max-width: 1000px; margin: 28px auto 80px; padding: 0 18px; }
    #loader { position: fixed; inset: 0; background: rgba(255,255,255,.92); z-index: 2000; display: none; align-items: center; justify-content: center; }

    .summary-bar { background: var(--testo); color: #fff; padding: 26px 28px; border-radius: var(--raggio-card); margin-bottom: 28px; }
    .summary-label { font-size: .9375rem; color: #A8B2BF; letter-spacing: -.01em; }
    .summary-value { font-size: 2.6rem; font-weight: 700; letter-spacing: -.022em; color: var(--giallo); line-height: 1.05; margin-top: 2px; }
    .summary-bar .checkbox { color: #fff; font-size: 1rem; }
    .summary-bar .checkbox input { width: 22px; height: 22px; vertical-align: -4px; margin-right: 8px; }

    /* La famiglia è una scheda bianca con il suo titolo, non una riga di
     * tabella sotto una fascia colorata. Il colore torna a essere un accento. */
    .unit-card { background: #fff; border-radius: var(--raggio-card); box-shadow: var(--ombra); margin-bottom: 20px; overflow: hidden; }
    .unit-header { padding: 22px 24px 16px; display: flex; justify-content: space-between;
                   align-items: baseline; flex-wrap: wrap; gap: 10px; }
    .unit-title { font-weight: 600; font-size: 1.5rem; letter-spacing: -.022em; color: var(--testo); }
    .unit-badge { color: var(--testo-soft); font-size: .9375rem; }

    .custom-table { width: 100%; border-collapse: collapse; }
    .custom-table th { text-align: left; padding: 10px 24px; }
    .custom-table td { padding: 16px 24px; vertical-align: middle; }
    .custom-table .num { text-align: right; white-space: nowrap; }
    .row-dependent td:first-child { padding-left: 44px; }
    .dettagli-socio { display: flex; flex-direction: column; margin-top: 4px; color: var(--testo-soft); font-size: .9375rem; }

    /* La riga del pagamento sta in fondo alla famiglia, larga e da sola: è
     * l'unica cosa che si può fare in questa pagina. */
    .barra-saldo { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
                   padding: 20px 24px; border-top: 1px solid var(--filo); }
    .barra-saldo .da-pagare { font-size: 1.35rem; font-weight: 600; letter-spacing: -.022em; }
    .barra-saldo .azioni { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
    .barra-saldo .domanda { font-weight: 600; color: var(--blu-dark); }
    .nucleo-saldato { color: var(--ok); font-weight: 600; font-size: 1.15rem; }

    @media screen and (max-width: 768px) {
      .summary-value { font-size: 2.1rem; }
      .custom-table th, .custom-table td { padding-left: 18px; padding-right: 18px; }
      .unit-header, .barra-saldo { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body>

<div id="loader"><div class="button is-loading is-large is-white"></div></div>

<div class="container-main">
  <div class="level is-mobile mb-4">
    <div class="level-left"><img class="logo-testata mr-3" src="logo_sciclubdonbosco.png" alt="Sci Club Don Bosco"><h1 class="title is-4 mb-0">Pannello Pagamenti</h1></div>
    <div class="level-right">
      <a class="button is-small is-light mr-2" href="index.html">Soci</a>
      <a class="button is-small is-light mr-2" href="riepilogo.html">Riepilogo</a>
      <a class="button is-small is-danger is-outlined mr-2" href="stagione.html" title="Chiusura della stagione">Amministrazione</a>
      <button class="button is-small is-light" onclick="logout()">Esci</button>
    </div>
  </div>

  <div class="summary-bar">
    <div class="level is-mobile">
      <div class="level-left">
        <div>
          <div class="summary-label">Totale da incassare</div>
          <div class="summary-value" id="totalInsoluti">—</div>
          <div class="filtro-attivo" id="conteggioNuclei" style="color:#C3CCD6"></div>
        </div>
      </div>
      <div class="level-right">
        <label class="checkbox mr-4">
          <input type="checkbox" id="soloInsoluti" checked> Solo chi deve pagare
        </label>
        <button class="button is-link" onclick="caricaDati()">Aggiorna</button>
      </div>
    </div>
  </div>

  <p class="suggerimento mb-4">
    Quote, polizza e numero di tessera si modificano dalla pagina
    <a href="index.html">Soci</a>.
  </p>

  <div id="displayArea"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
  const el = (id) => document.getElementById(id);

  (async function init() {
    if (!(await requireAuth())) return;
    el("soloInsoluti").addEventListener("change", caricaDati);
    await caricaDati();

    // Aggiornamento in tempo reale: se un altro operatore incassa da un altro
    // computer, la pagina si aggiorna da sola.
    ascoltaSoci(() => caricaDati({ silenzioso: true }));
  })();

  /**
   * L'aggregazione per nucleo familiare è calcolata dalla vista households:
   * nella 1.x era codice JS lato Apps Script che rileggeva tutto il foglio ad
   * ogni chiamata.
   */
  async function caricaDati({ silenzioso = false } = {}) {
    if (!silenzioso) setLoading(true);
    try {
      let query = sb
        .from("households")
        .select("*")
        .gte("enrolled_at", inizioStagione())
        .order("last_name");

      if (el("soloInsoluti").checked) query = query.gt("household_balance", 0);

      const { data: nuclei, error } = await query;
      if (error) throw error;

      // I familiari a carico dei nuclei mostrati, in una sola query.
      const idPaganti = nuclei.map((n) => n.head_id);
      let familiari = [];
      if (idPaganti.length) {
        const { data, error: erroreFam } = await sb
          .from("members").select("*").in("payer_id", idPaganti).order("last_name");
        if (erroreFam) throw erroreFam;
        familiari = data;
      }

      const capofamiglia = await caricaCapofamiglia(idPaganti);
      render(nuclei, capofamiglia, familiari);
    } catch (error) {
      showToast("Errore: " + messaggioErrore(error), "is-danger");
    } finally {
      setLoading(false);
    }
  }

  async function caricaCapofamiglia(ids) {
    if (!ids.length) return {};
    const { data, error } = await sb.from("members").select("*").in("id", ids);
    if (error) throw error;
    return Object.fromEntries(data.map((s) => [s.id, s]));
  }

  function inizioStagione() {
    const oggi = new Date();
    const anno = oggi.getMonth() >= 8 ? oggi.getFullYear() : oggi.getFullYear() - 1;
    return new Date(anno, 8, 1).toISOString();
  }

  function render(nuclei, capofamiglia, familiari) {
    const totale = nuclei.reduce((somma, n) => somma + parseFloat(n.household_balance || 0), 0);
    el("totalInsoluti").textContent = fmt(totale);
    el("conteggioNuclei").textContent = `${nuclei.length} nuclei · ${familiari.length} familiari a carico`;

    const contenitore = el("displayArea");
    if (!nuclei.length) {
      contenitore.innerHTML =
        '<div class="notification is-light has-text-centered">Nessun nucleo da mostrare.</div>';
      return;
    }

    contenitore.innerHTML = nuclei.map((nucleo) => {
      const pagante = capofamiglia[nucleo.head_id];
      const aCarico = familiari.filter((f) => f.payer_id === nucleo.head_id);
      if (!pagante) return "";
      const saldo = parseFloat(nucleo.household_balance || 0);

      return `
        <div class="unit-card">
          <div class="unit-header">
            <span class="unit-title">${nucleo.last_name} ${nucleo.first_name}</span>
            <span class="unit-badge">${aCarico.length ? aCarico.length + 1 + " persone" : "1 persona"} · Totale ${fmt(nucleo.household_total)}</span>
          </div>
          <div class="tabella-scorrevole">
            <table class="custom-table">
              <thead><tr>
                <th>Socio</th><th class="num">Quota</th><th class="num">Già versato</th><th class="num">Da pagare</th>
              </tr></thead>
              <tbody>
                ${rigaSocio(pagante, false)}
                ${aCarico.map((f) => rigaSocio(f, true)).join("")}
              </tbody>
            </table>
          </div>
          ${barraSaldo(nucleo.head_id, saldo)}
        </div>`;
    }).join("");

    contenitore.querySelectorAll("button[data-chiedi]").forEach((bottone) => {
      bottone.addEventListener("click", () => chiediConferma(bottone.dataset.chiedi));
    });
  }

  /** Riga in sola lettura: in questa pagina non si modifica niente del socio. */
  function rigaSocio(socio, eFamiliare) {
    const saldo = parseFloat(socio.balance || 0);
    const dettagli = [socio.card_type, socio.family_discount,
                      socio.pass_type, socio.course_type]
      .filter((v) => v && v.toLowerCase() !== "no");

    return `
      <tr class="${eFamiliare ? "row-dependent" : ""}">
        <td>
          <b>${socio.last_name} ${socio.first_name}</b>${eFamiliare ? " <small>(a carico)</small>" : ""}
          <div class="dettagli-socio">${dettagli.map((d) => `<span>${d}</span>`).join("")}</div>
        </td>
        <td class="num">${fmt(socio.total)}</td>
        <td class="num">${fmt(socio.paid)}</td>
        <td class="num" style="font-weight:700;color:${saldo > 0 ? "var(--errore)" : "var(--ok)"}">${fmt(saldo)}</td>
      </tr>`;
  }

  /**
   * Un solo pulsante per famiglia. La conferma è dentro la pagina e non una
   * finestra del browser: chi incassa vede la cifra e il nome mentre conferma,
   * invece di un avviso che copre tutto e si chiude a caso.
   */
  function barraSaldo(idPagante, saldo) {
    if (saldo <= 0) {
      return `<div class="barra-saldo"><span class="nucleo-saldato">Nucleo saldato</span></div>`;
    }
    return `
      <div class="barra-saldo" id="barra_${idPagante}">
        <span class="da-pagare">Da incassare: ${fmt(saldo)}</span>
        <span class="azioni">
          <button class="button is-evidenza" data-chiedi="${idPagante}">Incassa ${fmt(saldo)}</button>
        </span>
      </div>`;
  }

  function chiediConferma(idPagante) {
    const barra = el("barra_" + idPagante);
    if (!barra) return;
    const azioni = barra.querySelector(".azioni");
    const importo = barra.querySelector(".da-pagare").textContent.replace("Da incassare: ", "");

    azioni.innerHTML = `
      <span class="domanda">Hai riscosso ${importo}?</span>
      <button class="button is-light" data-annulla>No</button>
      <button class="button is-success" data-conferma>Sì, incassato</button>`;

    azioni.querySelector("[data-annulla]").addEventListener("click", () => {
      azioni.innerHTML =
        `<button class="button is-evidenza" data-chiedi="${idPagante}">Incassa ${importo}</button>`;
      azioni.querySelector("button").addEventListener("click", () => chiediConferma(idPagante));
    });
    azioni.querySelector("[data-conferma]").addEventListener("click", () => salda(idPagante));
  }

  /**
   * Porta a zero il saldo di tutta la famiglia. Il calcolo sta in
   * settle_household() sul database: le righe del nucleo cambiano tutte
   * insieme, e non esiste il caso "metà famiglia risulta pagata" per una
   * connessione caduta a metà elenco.
   */
  async function salda(idPagante) {
    setLoading(true);
    try {
      const { data, error } = await sb.rpc("settle_household", { head_id: idPagante });
      if (error) throw error;

      const esito = Array.isArray(data) ? data[0] : data;
      showToast(esito && esito.members_settled
        ? `Incassati ${fmt(esito.amount)} — ${esito.members_settled} soci saldati`
        : "Questo nucleo era già saldato.");
      await caricaDati({ silenzioso: true });
    } catch (error) {
      showToast(messaggioErrore(error), "is-danger");
    } finally {
      setLoading(false);
    }
  }
</script>
</body>
</html>
