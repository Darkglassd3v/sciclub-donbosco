<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pannello Pagamenti — Sci Club Don Bosco</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    body { background: #eef1f5; font-family: sans-serif; }
    .container-main { max-width: 1200px; margin: 20px auto 60px; padding: 0 15px; }
    #loader { position: fixed; inset: 0; background: rgba(255,255,255,.9); z-index: 2000; display: none; align-items: center; justify-content: center; }
    .summary-bar { background: #212529; color: #fff; padding: 18px 22px; border-radius: 10px; margin-bottom: 22px; }
    .summary-value { font-size: 1.9rem; font-weight: 800; color: #ffca28; }
    .unit-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 18px; overflow: hidden; }
    .unit-header { background: #1a73e8; color: #fff; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .unit-title { font-weight: 700; }
    .unit-badge { background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 20px; font-size: .85rem; }
    .custom-table { width: 100%; border-collapse: collapse; }
    .custom-table th { background: #f1f3f5; text-align: left; padding: 8px 12px; font-size: .78rem; text-transform: uppercase; color: #555; }
    .custom-table td { padding: 10px 12px; border-top: 1px solid #eee; vertical-align: middle; }
    .row-dependent td:first-child { padding-left: 28px; }
    .input-field { width: 110px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }
    .badge-saldo { font-weight: 700; color: #fff; padding: 4px 8px; border-radius: 4px; }
    .filtro-attivo { font-size: .85rem; color: #666; }
  </style>
</head>
<body>

<div id="loader"><div class="button is-loading is-large is-white"></div></div>

<div class="container-main">
  <div class="level is-mobile mb-4">
    <div class="level-left"><h1 class="title is-4 mb-0">Pannello Pagamenti</h1></div>
    <div class="level-right">
      <a class="button is-small is-light mr-2" href="index.html">Soci</a>
      <a class="button is-small is-light mr-2" href="riepilogo.html">Riepilogo</a>
      <button class="button is-small is-light" onclick="logout()">Esci</button>
    </div>
  </div>

  <div class="summary-bar">
    <div class="level is-mobile">
      <div class="level-left">
        <div>
          <div style="font-size:.78rem;color:#adb5bd;text-transform:uppercase;letter-spacing:1px">Totale da incassare</div>
          <div class="summary-value" id="totalInsoluti">—</div>
          <div class="filtro-attivo" id="conteggioNuclei"></div>
        </div>
      </div>
      <div class="level-right">
        <label class="checkbox mr-4" style="color:#fff">
          <input type="checkbox" id="soloInsoluti" checked> Solo con saldo aperto
        </label>
        <button class="button is-link" onclick="caricaDati()">🔄 Aggiorna</button>
      </div>
    </div>
  </div>

  <div id="displayArea"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
  const el = (id) => document.getElementById(id);

  (async function init() {
    if (!(await requireAuth())) return;
    el("soloInsoluti").addEventListener("change", caricaDati);
    await caricaDati();

    // Aggiornamento in tempo reale: se un altro operatore salva un'iscrizione
    // o un acconto, la pagina si ricarica da sola.
    ascoltaSoci(() => caricaDati({ silenzioso: true }));
  })();

  /**
   * L'aggregazione per nucleo familiare è calcolata dalla vista
   * nuclei_familiari: nella 1.x era codice JS lato Apps Script che rileggeva
   * tutto il foglio ad ogni chiamata.
   */
  async function caricaDati({ silenzioso = false } = {}) {
    if (!silenzioso) setLoading(true);
    try {
      let query = sb
        .from("nuclei_familiari")
        .select("*")
        .gte("data_iscrizione", inizioStagione())
        .order("cognome");

      if (el("soloInsoluti").checked) query = query.gt("saldo_nucleo", 0);

      const { data: nuclei, error } = await query;
      if (error) throw error;

      // I familiari a carico dei nuclei mostrati, in una sola query.
      const idPaganti = nuclei.map((n) => n.payer_id);
      let familiari = [];
      if (idPaganti.length) {
        const { data, error: erroreFam } = await sb
          .from("soci").select("*").in("payer_id", idPaganti).order("cognome");
        if (erroreFam) throw erroreFam;
        familiari = data;
      }

      const capofamiglia = await caricaCapofamiglia(idPaganti);
      render(nuclei, capofamiglia, familiari);
    } catch (error) {
      showToast("Errore: " + messaggioErrore(error), "is-danger");
    } finally {
      setLoading(false);
    }
  }

  async function caricaCapofamiglia(ids) {
    if (!ids.length) return {};
    const { data, error } = await sb.from("soci").select("*").in("id", ids);
    if (error) throw error;
    return Object.fromEntries(data.map((s) => [s.id, s]));
  }

  function inizioStagione() {
    const oggi = new Date();
    const anno = oggi.getMonth() >= 8 ? oggi.getFullYear() : oggi.getFullYear() - 1;
    return new Date(anno, 8, 1).toISOString();
  }

  function render(nuclei, capofamiglia, familiari) {
    const totale = nuclei.reduce((somma, n) => somma + parseFloat(n.saldo_nucleo || 0), 0);
    el("totalInsoluti").textContent = fmt(totale);
    el("conteggioNuclei").textContent = `${nuclei.length} nuclei · ${familiari.length} familiari a carico`;

    const contenitore = el("displayArea");
    if (!nuclei.length) {
      contenitore.innerHTML = '<div class="notification is-light has-text-centered">Nessun nucleo da mostrare.</div>';
      return;
    }

    contenitore.innerHTML = nuclei.map((nucleo) => {
      const pagante = capofamiglia[nucleo.payer_id];
      const aCarico = familiari.filter((f) => f.payer_id === nucleo.payer_id);
      if (!pagante) return "";

      return `
        <div class="unit-card">
          <div class="unit-header">
            <span class="unit-title">👤 ${nucleo.cognome} ${nucleo.nome}</span>
            <span class="unit-badge">Totale nucleo: ${fmt(nucleo.totale_nucleo)} · Saldo: ${fmt(nucleo.saldo_nucleo)}</span>
          </div>
          <table class="custom-table">
            <thead><tr>
              <th>Socio</th><th>Totale</th><th>Acconto</th><th>Saldo</th><th>Polizza</th><th>Azione</th>
            </tr></thead>
            <tbody>
              ${rigaSocio(pagante, false)}
              ${aCarico.map((f) => rigaSocio(f, true)).join("")}
            </tbody>
          </table>
        </div>`;
    }).join("");

    contenitore.querySelectorAll("button[data-salva]").forEach((bottone) => {
      bottone.addEventListener("click", () => salvaRiga(bottone.dataset.salva));
    });
  }

  /**
   * Una sola funzione per capofamiglia e familiari: entrambi hanno acconto e
   * polizza modificabili. Nella 1.x il familiare era in sola lettura e per
   * correggergli l'acconto bisognava passare dall'altra applicazione.
   */
  function rigaSocio(socio, eFamiliare) {
    const saldo = parseFloat(socio.saldo || 0);
    const stile = `background:${saldo > 0 ? "#e53935" : "#43a047"}`;
    const dettagli = [socio.tipologia_tessera, socio.agevolazioni_famiglia, socio.tipo_abbonamento, socio.tipologia_corso]
      .filter((v) => v && v.toLowerCase() !== "no");

    return `
      <tr class="${eFamiliare ? "row-dependent" : ""}">
        <td>
          <b>${socio.cognome} ${socio.nome}</b>${eFamiliare ? ' <small style="color:#888">(fam)</small>' : ""}
          <div style="display:flex;flex-direction:column;font-size:.82em;margin-top:4px;color:#666">
            ${dettagli.map((d) => `<span>${d}</span>`).join("")}
          </div>
        </td>
        <td style="font-weight:600">${fmt(socio.totale)}</td>
        <td><input type="number" step="0.01" class="input-field" id="dep_${socio.id}" value="${socio.acconto}"></td>
        <td><span class="badge-saldo" style="${stile}">${fmt(saldo)}</span></td>
        <td><input type="text" class="input-field" id="pol_${socio.id}" value="${socio.numero_polizza || ""}"></td>
        <td><button class="button is-small is-warning has-text-weight-bold" data-salva="${socio.id}">Salva</button></td>
      </tr>`;
  }

  /**
   * Si scrivono solo acconto e polizza: il saldo è una colonna generata e si
   * aggiorna da sé. Nella 1.x andava ricalcolato e riscritto a mano, ed è da lì
   * che nascevano i saldi disallineati.
   */
  async function salvaRiga(idSocio) {
    setLoading(true);
    try {
      const { error } = await sb.from("soci").update({
        acconto: parseFloat(el("dep_" + idSocio).value) || 0,
        numero_polizza: el("pol_" + idSocio).value.trim() || null,
      }).eq("id", idSocio);
      if (error) throw error;

      showToast("✅ Dati aggiornati");
      await caricaDati({ silenzioso: true });
    } catch (error) {
      showToast("❌ " + messaggioErrore(error), "is-danger");
    } finally {
      setLoading(false);
    }
  }
</script>
</body>
</html>
