<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accesso — Sci Club Don Bosco</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" integrity="sha384-HmYpsz2Aa9Gh3JlkCoh8kUJ2mUKJKTnkyC2Lzt8aLzpPOpnDe8KpFE2xNiBpMDou" crossorigin="anonymous">
  <link rel="stylesheet" href="brand.css?v=20261103caricamento">
  <script>try{if(localStorage.getItem("sciclub-tema")==="scuro")document.documentElement.dataset.tema="scuro"}catch(e){}</script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .card-login { max-width: 420px; width: 100%; background: var(--superficie); padding: 44px 40px; border-radius: var(--raggio-card); box-shadow: var(--ombra); }
    .card-login .title { font-size: 1.9rem; letter-spacing: -.022em; }
    .card-login .oppure { text-align: center; color: var(--testo-soft); margin: 1.25rem 0 .75rem; }
    #btnGoogle { border: 1px solid var(--bordo, #c9ced6); }
    .card-login .sottotitolo { color: var(--testo-soft); text-align: center; margin-top: -.5rem; margin-bottom: 1.75rem; }
  </style>
</head>
<body>

<div class="card-login" role="main">
  <img src="logo-ufficiale-tondo.svg" alt="Sci Club Don Bosco" style="display:block;margin:0 auto 18px;width:160px;height:160px">
  <h1 class="title is-4 has-text-centered">Sci Club Don Bosco</h1>
  <p class="sottotitolo">Gestione soci, iscrizioni e pagamenti.</p>
  <p class="subtitle is-6 has-text-centered has-text-grey-dark">Accesso riservato ai volontari del club</p>

  <form id="loginForm">
    <div class="field">
      <label class="label" for="email">Email</label>
      <input class="input" type="email" id="email" required autocomplete="username">
    </div>
    <div class="field">
      <label class="label" for="password">Password</label>
      <div class="campo-password">
        <input class="input" type="password" id="password" required autocomplete="current-password">
        <button type="button" class="occhio" data-mostra="password"></button>
      </div>
    </div>
    <button class="button is-link is-fullwidth has-text-weight-bold" id="btnLogin" type="submit">Entra</button>
  </form>

  <p class="oppure" aria-hidden="true">oppure</p>
  <button type="button" class="button is-fullwidth has-text-weight-bold" id="btnGoogle">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="margin-right:10px"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9h-4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>
    Accedi con Google
  </button>

  <p id="errore" class="notification is-danger is-light mt-4" role="alert" style="display:none"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="config.js?v=20261016d"></script>
<script src="shared.js?v=20261116rete"></script>
<script>
  // Un solo indirizzo per tutti, la radice del sito: dopo l'accesso ognuno va
  // dove lo manda il suo ruolo (paginaDiArrivo in shared.js), oppure alla
  // pagina da cui era stato mandato qui (?next=).
  //
  // `next` arriva dall'indirizzo, quindi chiunque può scriverlo: si accetta
  // solo il nome di una pagina di questo sito (anche in ricerca/), mai un
  // indirizzo completo, che porterebbe altrove chi ha appena fatto l'accesso.
  const request = new URLSearchParams(location.search);
  const next = request.get("next");
  const requestedPage = /^(ricerca\/)?[a-z]+\.html(\?[\w=&-]*)?$/i.test(next || "") ? next : null;

  bindShowPassword();

  const err = document.getElementById("errore");
  function showError(text) {
    err.textContent = text;
    err.style.display = "block";
  }

  /**
   * Messaggio per il ritorno da Google con un errore (frammento «#error=...» dell'indirizzo), o "" se non ce
   * n'è. «Signups not allowed»: l'account Google non corrisponde a nessun account del gestionale, perché qui
   * gli account li crea solo il pannello Utenti e la registrazione libera è spenta (docs/ACCOUNT.md).
   */
  function googleError(fragment) {
    const values = new URLSearchParams(String(fragment || "").replace(/^#/, ""));
    if (!values.get("error")) return "";
    if (values.get("error_code") === "signup_disabled" || /signups? not allowed/i.test(values.get("error_description") || "")) {
      return "Questo account Google non è registrato nel gestionale: rivolgersi all'amministratore degli utenti del club, "
        + "che può creare l'account con lo stesso indirizzo email, oppure entrare con email e password.";
    }
    return "Accesso con Google non riuscito: riprovare, oppure entrare con email e password.";
  }

  const googleReturn = googleError(location.hash);
  if (googleReturn) {
    showError(googleReturn);
    history.replaceState(null, "", location.pathname + location.search);
  }

  // Si torna a questa stessa pagina, con la pagina richiesta (?next=): al ritorno la sessione c'è e
  // getSession() qui sotto entra come con la password.
  document.getElementById("btnGoogle").addEventListener("click", async () => {
    const button = document.getElementById("btnGoogle");
    err.style.display = "none";
    button.classList.add("is-loading");
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname + location.search },
    });
    if (error) {
      button.classList.remove("is-loading");
      showError("Accesso con Google non riuscito: " + errorMessage(error));
    }
  });

  const WITHOUT_ROLE = "Questo account non ha ancora un ruolo assegnato e non può accedere ad alcuna sezione. "
    + "Rivolgersi all'amministratore degli utenti del club per l'assegnazione.";
  // Rimandato qui da una pagina perché l'account non ha un ruolo: la sessione
  // non serve a niente, si chiude.
  if (request.get("senza")) {
    showError(WITHOUT_ROLE);
    getProfile().catch(() => null).then(closeViewAs).finally(() => sb.auth.signOut());
  }

  /**
   * Dopo l'accesso: la pagina chiesta o quella del ruolo; senza ruolo si resta
   * qui. Con la password iniziale ancora da cambiare, prima si cambia quella.
   */
  async function enter() {
    const access = await getProfile();
    const landing = landingPage(access);
    if (!landing) {
      await closeViewAs(access);
      await sb.auth.signOut();
      showError(WITHOUT_ROLE);
      return;
    }
    location.replace(access.change_password ? "password.html" : requestedPage || landing);
  }

  // Se la sessione è già valida si salta il login (ma non se si è appena
  // stati rimandati qui perché senza ruolo).
  sb.auth.getSession().then(({ data }) => {
    if (data.session && !request.get("senza")) enter().catch((e) => showError(errorMessage(e)));
  });

  document.getElementById("loginForm").addEventListener("submit", async (theEvent) => {
    theEvent.preventDefault();
    const button = document.getElementById("btnLogin");
    err.style.display = "none";
    button.classList.add("is-loading");

    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    });

    if (error) {
      button.classList.remove("is-loading");
      showError("Accesso non riuscito: " + errorMessage(error));
      return;
    }
    await enter().catch((e) => showError(errorMessage(e)));
    button.classList.remove("is-loading");
  });
</script>
</body>
</html>
