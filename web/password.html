<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambia password — Sci Club Don Bosco</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" integrity="sha384-HmYpsz2Aa9Gh3JlkCoh8kUJ2mUKJKTnkyC2Lzt8aLzpPOpnDe8KpFE2xNiBpMDou" crossorigin="anonymous">
  <link rel="stylesheet" href="brand.css?v=20261028material">
  <script>try{const h=document.documentElement,t=localStorage.getItem("sciclub-testo");if(t>0)h.dataset.testo=t;if(localStorage.getItem("sciclub-tema")==="scuro")h.dataset.tema="scuro"}catch(e){}</script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .card-login { max-width: 460px; width: 100%; background: var(--superficie); padding: 44px 40px; border-radius: var(--raggio-card); box-shadow: var(--ombra); }
    .card-login .title { font-size: 1.9rem; letter-spacing: -.022em; }
    .card-login .sottotitolo { color: var(--testo-soft); text-align: center; margin-top: -.5rem; margin-bottom: 1.75rem; }
    #account { font-weight: 700; overflow-wrap: anywhere; }
    @media (max-width: 480px) { .card-login { padding: 32px 20px; } }
  </style>
</head>
<body>

<div class="card-login" role="main">
  <img src="logo-ufficiale-trasparente-lettere-blu.svg" alt="Sci Club Don Bosco" style="display:block;margin:0 auto 18px;max-width:220px">
  <h1 class="title is-4 has-text-centered">Modifica della password</h1>
  <p class="sottotitolo">
    Prima di accedere è necessario scegliere una password personale.<br>
    Account: <span id="account"></span>
  </p>

  <form id="formPassword">
    <div class="field">
      <label class="label" for="attuale">Password attuale</label>
      <div class="campo-password">
        <input class="input" type="password" id="attuale" required autocomplete="current-password">
        <button type="button" class="occhio" data-mostra="attuale"></button>
      </div>
    </div>
    <div class="field">
      <label class="label" for="nuova">Nuova password</label>
      <div class="campo-password">
        <input class="input" type="password" id="nuova" required minlength="8" autocomplete="new-password">
        <button type="button" class="occhio" data-mostra="nuova"></button>
      </div>
      <p class="help">Almeno 8 caratteri.</p>
    </div>
    <div class="field">
      <label class="label" for="conferma">Conferma nuova password</label>
      <div class="campo-password">
        <input class="input" type="password" id="conferma" required minlength="8" autocomplete="new-password">
        <button type="button" class="occhio" data-mostra="conferma"></button>
      </div>
    </div>
    <button class="button is-link is-fullwidth has-text-weight-bold" id="btnCambia" type="submit">Cambia password</button>
  </form>

  <p id="errore" class="notification is-danger is-light mt-4" role="alert" style="display:none"></p>
  <p class="has-text-centered mt-4"><button type="button" class="button is-text" onclick="logout()">Esci</button></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="config.js?v=20261016d"></script>
<script src="shared.js?v=20261028material"></script>
<script>
  // Qui arriva chi ha ancora la password iniziale (my_access().change_password):
  // la mandano requirePermesso() in shared.js, il login e il sito ricerca/.
  // L'obbligo lo toglie il database da solo quando la password cambia davvero
  // (trigger password_changed in supabase/schema.sql).
  const field = (id) => document.getElementById(id);
  const err = field("errore");
  function showError(text) {
    err.textContent = text;
    err.style.display = "block";
  }

  let email = null;
  (async function init() {
    const currentSession = await requireAuth();
    if (!currentSession) return;
    email = currentSession.user.email;
    field("account").textContent = email;
  })();

  bindShowPassword();

  field("formPassword").addEventListener("submit", async (theEvent) => {
    theEvent.preventDefault();
    err.style.display = "none";
    const current = field("attuale").value;
    const newOne = field("nuova").value;
    if (newOne.length < 8) return showError("La nuova password deve avere almeno 8 caratteri.");
    if (newOne !== field("conferma").value) {
      return showError("La conferma non coincide con la nuova password: inserire di nuovo entrambe.");
    }
    if (newOne === current) return showError("La nuova password deve essere diversa da quella attuale.");
    // Premuto prima che la pagina abbia letto l'account: l'accesso partirebbe con l'email vuota.
    if (!email) return showError("Caricamento dell'account in corso: riprovare tra un istante.");

    const button = field("btnCambia");
    button.classList.add("is-loading");
    try {
      // updateUser() non chiede la password attuale: la si controlla rifacendo
      // l'accesso, così chi trova il computer aperto non la cambia al posto tuo.
      const { error: accessError } = await sb.auth.signInWithPassword({ email, password: current });
      if (accessError) {
        return showError(/invalid login credentials/i.test(accessError.message)
          ? "La password attuale non è corretta."
          : "Modifica non riuscita: " + errorMessage(accessError));
      }
      const { error: changeError } = await sb.auth.updateUser({ password: newOne });
      if (changeError) return showError("Modifica non riuscita: " + errorMessage(changeError));
      // Le altre sessioni si chiudono: chi era entrato con la password iniziale (che è
      // pubblica) resterebbe dentro, e ora con i permessi. Se non riesce, il cambio vale lo stesso.
      await sb.auth.signOut({ scope: "others" }).catch(() => {});

      const access = await getProfile();
      location.replace(landingPage(access) || "login.html?senza=1");
    } catch (e) {
      showError("Modifica non riuscita: " + errorMessage(e));
    } finally {
      button.classList.remove("is-loading");
    }
  });
</script>
</body>
</html>
