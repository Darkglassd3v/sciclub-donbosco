<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambia password — Sci Club Don Bosco</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="brand.css">
  <script>try{const t=localStorage.getItem("sciclub-testo");if(t>0)document.documentElement.dataset.testo=t}catch(e){}</script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .card-login { max-width: 460px; width: 100%; background: #fff; padding: 44px 40px; border-radius: var(--raggio-card); box-shadow: var(--ombra); }
    .card-login .title { font-size: 1.9rem; letter-spacing: -.022em; }
    .card-login .sottotitolo { color: var(--testo-soft); text-align: center; margin-top: -.5rem; margin-bottom: 1.75rem; }
    #account { font-weight: 700; overflow-wrap: anywhere; }
    @media (max-width: 480px) { .card-login { padding: 32px 20px; } }
  </style>
</head>
<body>

<div class="card-login">
  <img src="logo_sciclubdonbosco.svg" alt="Sci Club Don Bosco" style="display:block;margin:0 auto 18px;max-width:220px">
  <h1 class="title is-4 has-text-centered">Cambia la password</h1>
  <p class="sottotitolo">
    Prima di entrare scegli una password tua, che sai solo tu.<br>
    Account: <span id="account"></span>
  </p>

  <form id="formPassword">
    <div class="field">
      <label class="label" for="attuale">Password attuale</label>
      <input class="input" type="password" id="attuale" required autocomplete="current-password">
    </div>
    <div class="field">
      <label class="label" for="nuova">Nuova password</label>
      <input class="input" type="password" id="nuova" required minlength="8" autocomplete="new-password">
      <p class="help">Almeno 8 caratteri.</p>
    </div>
    <div class="field">
      <label class="label" for="conferma">Conferma nuova password</label>
      <input class="input" type="password" id="conferma" required minlength="8" autocomplete="new-password">
    </div>
    <div class="field">
      <label class="checkbox"><input type="checkbox" id="mostra"> Mostra le password mentre scrivo</label>
    </div>
    <button class="button is-link is-fullwidth has-text-weight-bold" id="btnCambia" type="submit">Cambia password</button>
  </form>

  <p id="errore" class="notification is-danger is-light mt-4" role="alert" style="display:none"></p>
  <p class="has-text-centered mt-4"><button type="button" class="button is-text" onclick="logout()">Esci</button></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
  // Qui arriva chi ha ancora la password iniziale (my_access().change_password):
  // la mandano requirePermesso() in shared.js, il login e il sito ricerca/.
  // L'obbligo lo toglie il database da solo quando la password cambia davvero
  // (trigger password_changed in supabase/schema.sql).
  const campo = (id) => document.getElementById(id);
  const errore = campo("errore");
  function mostraErrore(testo) {
    errore.textContent = testo;
    errore.style.display = "block";
  }

  let email = null;
  (async function init() {
    const sessione = await requireAuth();
    if (!sessione) return;
    email = sessione.user.email;
    campo("account").textContent = email;
  })();

  campo("mostra").addEventListener("change", (evento) => {
    ["attuale", "nuova", "conferma"].forEach((id) => { campo(id).type = evento.target.checked ? "text" : "password"; });
  });

  campo("formPassword").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    errore.style.display = "none";
    const attuale = campo("attuale").value;
    const nuova = campo("nuova").value;
    if (nuova.length < 8) return mostraErrore("La nuova password deve avere almeno 8 caratteri.");
    if (nuova !== campo("conferma").value) {
      return mostraErrore("La conferma non è uguale alla nuova password: riscrivile tutte e due.");
    }
    if (nuova === attuale) return mostraErrore("La nuova password deve essere diversa da quella attuale.");

    const bottone = campo("btnCambia");
    bottone.classList.add("is-loading");
    try {
      // updateUser() non chiede la password attuale: la si controlla rifacendo
      // l'accesso, così chi trova il computer aperto non la cambia al posto tuo.
      const { error: errAccesso } = await sb.auth.signInWithPassword({ email, password: attuale });
      if (errAccesso) {
        return mostraErrore(/invalid login credentials/i.test(errAccesso.message)
          ? "La password attuale non è giusta."
          : "Cambio non riuscito: " + messaggioErrore(errAccesso));
      }
      const { error: errCambio } = await sb.auth.updateUser({ password: nuova });
      if (errCambio) return mostraErrore("Cambio non riuscito: " + messaggioErrore(errCambio));

      const accesso = await getProfile();
      location.replace(paginaDiArrivo(accesso) || "login.html?senza=1");
    } catch (e) {
      mostraErrore("Cambio non riuscito: " + messaggioErrore(e));
    } finally {
      bottone.classList.remove("is-loading");
    }
  });
</script>
</body>
</html>
