<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riepilogo — Sci Club Don Bosco</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="brand.css">
  <style>
    .container-main { max-width: 1200px; margin: 28px auto 80px; padding: 0 18px; }
    #loader { position: fixed; inset: 0; background: rgba(255,255,255,.92); z-index: 2000; display: none; align-items: center; justify-content: center; }

    .kpi { background: #fff; border-radius: var(--raggio-card); padding: 26px 20px; box-shadow: var(--ombra); text-align: center; height: 100%; }
    .kpi-label { font-size: .9375rem; letter-spacing: -.01em; color: var(--testo-soft); }
    .kpi-value { font-size: 2.4rem; font-weight: 700; letter-spacing: -.022em; margin-top: 6px; line-height: 1.05; }

    .section-card { background: #fff; border-radius: var(--raggio-card); overflow: hidden; box-shadow: var(--ombra); height: 100%; }

    /* Il colore era una fascia piena in testa a ogni riquadro: quattro bande
     * accese una sopra l'altra. Adesso è un punto, e il titolo si legge nero. */
    .section-header { color: var(--testo); padding: 20px 22px 12px; font-weight: 600;
                      font-size: 1.2rem; letter-spacing: -.022em;
                      display: flex; align-items: center; gap: 10px; }
    .section-header::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
    /* Stesso codice colore degli abbonamenti: sabato blu, domenica giallo. */
    .bg-blue::before   { background: var(--blu); }
    .bg-yellow::before { background: var(--giallo); }
    .bg-green::before  { background: var(--ok); }
    .bg-grey::before   { background: var(--testo-soft); }

    .section-body { padding: 0 22px 20px; }
    .rtable { width: 100%; border-collapse: collapse; }
    .rtable th { text-align: left; padding: 10px 6px; }
    .rtable td { padding: 14px 6px; }
    .total-row td { font-weight: 600; border-top: 2px solid var(--testo-soft); }
    .badge { display: inline-block; padding: 4px 12px; border-radius: var(--pillola); font-weight: 600; font-size: .9375rem; }
    .badge-blue { background: var(--blu-light); color: var(--blu-dark); }
    .badge-green { background: var(--ok-bg); color: var(--ok); }
  </style>
</head>
<body>

<div id="loader"><div class="button is-loading is-large is-white"></div></div>

<div class="container-main">
  <div class="level is-mobile mb-4">
    <div class="level-left">
      <div>
        <img class="logo-testata mb-2" src="logo_sciclubdonbosco.png" alt="Sci Club Don Bosco">
        <h1 class="title is-4 mb-1">Riepilogo Stagione</h1>
        <p class="has-text-grey is-size-7" id="lastUpdate"></p>
      </div>
    </div>
    <div class="level-right">
      <a class="button is-small is-light mr-2" href="index.html">Soci</a>
      <a class="button is-small is-light mr-2" href="admin.html">Pagamenti</a>
      <a class="button is-small is-danger is-outlined mr-2" href="stagione.html" title="Chiusura della stagione">Amministrazione</a>
      <button class="button is-small is-light" onclick="logout()">Esci</button>
    </div>
  </div>

  <div class="columns is-multiline mb-2">
    <div class="column is-3"><div class="kpi"><div class="kpi-label">Soci</div><div class="kpi-value" id="kSoci">—</div></div></div>
    <div class="column is-3"><div class="kpi"><div class="kpi-label">Totale teorico</div><div class="kpi-value" id="kTeor">—</div></div></div>
    <div class="column is-3"><div class="kpi"><div class="kpi-label">Incassato</div><div class="kpi-value has-text-success" id="kInc">—</div></div></div>
    <div class="column is-3"><div class="kpi"><div class="kpi-label">Da incassare</div><div class="kpi-value has-text-danger" id="kDa">—</div></div></div>
  </div>

  <div class="columns is-multiline">
    <div class="column is-4">
      <div class="section-card">
        <div class="section-header bg-blue">Gite del sabato</div>
        <div class="section-body"><table class="rtable"><thead><tr><th>Località</th><th>Iscritti</th></tr></thead><tbody id="tGiteSab"></tbody></table></div>
      </div>
    </div>
    <div class="column is-4">
      <div class="section-card">
        <div class="section-header bg-yellow">Gite della domenica</div>
        <div class="section-body"><table class="rtable"><thead><tr><th>Località</th><th>Iscritti</th></tr></thead><tbody id="tGiteDom"></tbody></table></div>
      </div>
    </div>
    <div class="column is-4">
      <div class="section-card">
        <div class="section-header bg-green">Corsi</div>
        <div class="section-body"><table class="rtable"><thead><tr><th>Corso</th><th>Iscritti</th></tr></thead><tbody id="tCorsi"></tbody></table></div>
      </div>
    </div>
    <div class="column is-4">
      <div class="section-card">
        <div class="section-header bg-grey">Abbonamenti</div>
        <div class="section-body"><table class="rtable"><thead><tr><th>Tipo</th><th>Iscritti</th></tr></thead><tbody id="tAbb"></tbody></table></div>
      </div>
    </div>
    <div class="column is-8">
      <div class="section-card">
        <div class="section-header bg-blue">Tessere</div>
        <div class="section-body"><table class="rtable"><thead><tr><th>Tipo</th><th>N.</th><th>Prezzo</th><th>Totale</th></tr></thead><tbody id="tTess"></tbody></table></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
  const el = (id) => document.getElementById(id);

  (async function init() {
    if (!(await requireAuth())) return;
    await carica();
    ascoltaSoci(() => carica({ silenzioso: true }));
  })();

  /**
   * Tutte le aggregazioni arrivano da viste SQL: nella 1.x erano cicli JS su
   * tutte le righe del foglio, rifatti ad ogni apertura della pagina.
   */
  async function carica({ silenzioso = false } = {}) {
    if (!silenzioso) setLoading(true);
    try {
      const [kpi, tessere, abbonamenti, corsi, partenze] = await Promise.all([
        sb.from("season_totals").select("*").single(),
        sb.from("card_counts").select("*"),
        sb.from("pass_counts").select("*"),
        sb.from("course_counts").select("*"),
        sb.from("departure_counts").select("*"),
      ]);

      const errore = [kpi, tessere, abbonamenti, corsi, partenze].find((r) => r.error);
      if (errore) throw errore.error;

      el("kSoci").textContent = kpi.data.total_members;
      el("kTeor").textContent = fmt(kpi.data.total_due);
      el("kInc").textContent = fmt(kpi.data.total_collected);
      el("kDa").textContent = fmt(kpi.data.outstanding);
      el("lastUpdate").textContent = "Aggiornato: " + new Date().toLocaleString("it-IT");

      const perGiorno = (giorno) => partenze.data
        .filter((r) => r.day === giorno)
        .map((r) => [r.place, Number(r.count)]);

      riempiConteggi("tGiteSab", perGiorno("SABATO"));
      riempiConteggi("tGiteDom", perGiorno("DOMENICA"));
      riempiConteggi("tCorsi", corsi.data.map((r) => [r.name, Number(r.count)]));
      riempiConteggi("tAbb", abbonamenti.data.map((r) => [r.name, Number(r.count)]));
      riempiTessere(tessere.data);
    } catch (error) {
      showToast("Errore: " + messaggioErrore(error), "is-danger");
    } finally {
      setLoading(false);
    }
  }

  function riempiConteggi(id, voci) {
    const tbody = el(id);
    if (!voci.length) {
      tbody.innerHTML = '<tr><td colspan="2" class="has-text-grey-light has-text-centered py-3">—</td></tr>';
      return;
    }
    const ordinate = voci.sort((a, b) => b[1] - a[1]);
    const totale = ordinate.reduce((s, [, v]) => s + v, 0);
    tbody.innerHTML =
      ordinate.map(([nome, n]) => `<tr><td>${nome}</td><td><span class="badge badge-blue">${n}</span></td></tr>`).join("") +
      `<tr class="total-row"><td>Totale</td><td><span class="badge badge-green">${totale}</span></td></tr>`;
  }

  function riempiTessere(righe) {
    const tbody = el("tTess");
    if (!righe.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="has-text-grey-light has-text-centered py-3">—</td></tr>';
      return;
    }
    const ordinate = righe.sort((a, b) => Number(b.count) - Number(a.count));
    const totN = ordinate.reduce((s, r) => s + Number(r.count), 0);
    const totEuro = ordinate.reduce((s, r) => s + Number(r.total || 0), 0);
    tbody.innerHTML =
      ordinate.map((r) => `
        <tr>
          <td>${r.name}</td>
          <td><span class="badge badge-blue">${r.count}</span></td>
          <td>${r.price ? fmt(r.price) : "—"}</td>
          <td>${r.total ? fmt(r.total) : "—"}</td>
        </tr>`).join("") +
      `<tr class="total-row"><td>Totale</td><td><span class="badge badge-green">${totN}</span></td><td>—</td><td>${fmt(totEuro)}</td></tr>`;
  }
</script>
</body>
</html>
