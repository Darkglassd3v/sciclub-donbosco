<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <style>
    body { background-color: #e9ecef; margin: 0; padding: 0; min-height: 100vh; font-family: sans-serif; }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; }
    .container-main { max-width: 1100px; margin: 20px auto 180px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .section-title { background: #1a73e8; color: white; padding: 8px 15px; border-radius: 5px; margin-top: 25px; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; }

    .total-box { position: fixed; bottom: 0; left: 0; right: 0; background: #212529; color: white; padding: 15px; z-index: 1000; border-top: 4px solid #1a73e8; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }
    .val-label { font-size: 0.75rem; color: #adb5bd; text-transform: uppercase; letter-spacing: 1px; }
    .val-amount { font-size: 1.8rem; font-weight: 800; display: block; line-height: 1; margin-top: 5px; }
    .val-residuo { color: #ffca28; }

    #statusToast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3000; min-width: 300px; text-align: center; }

    #searchZone { display: none; background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffeeba; }
    .result-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #eee; background: white; transition: 0.2s; }
    .result-item:hover { background: #eff5fb; }
    .label { font-size: 0.85rem; margin-bottom: 0.2rem; color: #495057; }

    /* Pannello familiari a carico */
    #familyPanel { margin-top: 15px; }
    .family-title { background: #198754; color: white; padding: 8px 15px; border-radius: 5px; margin-top: 5px; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; }
    #payerResults { border: 1px solid #ddd; border-radius: 4px; display: none; position: relative; z-index: 100; background: white; }

    /* Sezione pagante disabilitata */
    .payer-section-disabled { opacity: 0.5; pointer-events: none; }

    @media screen and (max-width: 768px) {
      .total-box .columns { display: flex; flex-wrap: wrap; }
      .total-box .column.is-5 { width: 100%; flex: none; margin-top: 10px; }
      .button.is-large { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="button is-loading is-large is-white"></div>
  <p id="loaderText" class="mt-4 has-text-weight-bold">CARICAMENTO...</p>
</div>

<div id="statusToast" class="notification is-success"></div>

<div class="container-main">
  <h1 class="title is-4 has-text-centered mb-5">Sci Club Don Bosco - Gestione Soci</h1>

  <div class="columns is-mobile mb-5">
    <div class="column is-6">
      <button onclick="showSearch()" id="btnEdit" class="button is-link is-fullwidth has-text-weight-bold">
        🔄 MODIFICA SOCIO
      </button>
    </div>
    <div class="column is-6">
      <button onclick="resetForm()" class="button is-danger is-outlined is-fullwidth">
        ➕ NUOVO SOCIO
      </button>
    </div>
  </div>

  <div id="searchZone">
    <input id="searchInput" class="input" type="text" placeholder="Cerca cognome o codice fiscale..." oninput="filterDb()">
    <div id="searchResults" style="max-height: 200px; overflow-y: auto;" class="mt-2"></div>
  </div>

  <form id="memberForm">
    <input type="hidden" id="f_row">
    <input type="hidden" id="f_id_hidden">

    <!-- ===================== ANAGRAFICA ===================== -->
    <div class="section-title">Anagrafica Socio</div>
    <div class="columns is-multiline mt-1">
      <div class="column is-3"><label class="label">Cognome*</label><input class="input" id="f_lastName" required></div>
      <div class="column is-3"><label class="label">Nome*</label><input class="input" id="f_firstName" required></div>
      <div class="column is-4"><label class="label">Città Nascita*</label><input class="input" id="f_birthPlace" required></div>
      <div class="column is-2"><label class="label">Prov Nascita</label><input class="input" id="f_birthProv" maxlength="2"></div>
      <div class="column is-4"><label class="label">Codice Fiscale</label><input class="input" id="f_taxCode" pattern=".{16,16}"></div>
      <div class="column is-4"><label class="label">Data Nascita</label><input class="input" type="date" id="f_birthDate"></div>
      <div class="column is-4"><label class="label">Telefono*</label><input class="input" id="f_phone" required></div>
      <div class="column is-6"><label class="label">Indirizzo Residenza</label><input class="input" id="f_address"></div>
      <div class="column is-3"><label class="label">Città Residenza</label><input class="input" id="f_city"></div>
      <div class="column is-1"><label class="label">Prov Residenza</label><input class="input" id="f_prov" maxlength="2"></div>
      <div class="column is-2"><label class="label">CAP Residenza</label><input class="input" id="f_cap"></div>
      <div class="column is-12"><label class="label">Email</label><input class="input" type="email" id="f_email"></div>
    </div>

    <!-- ===================== ISCRIZIONE ===================== -->
    <div class="section-title">Scelte Iscrizione (TUTTI I CAMPI)</div>
    <div class="columns is-multiline mt-1">
      <div class="column is-6"><label class="label">Tipologia Tessera*</label><div class="select is-fullwidth"><select id="f_membership" onchange="calc()" required></select></div></div>
      <div class="column is-6"><label class="label">Agevolazione Famiglia</label><div class="select is-fullwidth"><select id="f_family" onchange="calc()"></select></div></div>
      <div class="column is-6"><label class="label">Abbonamento</label><div class="select is-fullwidth"><select id="f_subscription" onchange="calc()"></select></div></div>
      <div class="column is-6"><label class="label">Corso Sci/Snow</label><div class="select is-fullwidth"><select id="f_course" onchange="calc()"></select></div></div>
    </div>

    <div class="columns mt-1">
      <div class="column is-6">
        <label class="label">Partenza Sabato</label>
        <div id="check_saturday" class="control p-2" style="background: #f8f9fa; border-radius: 5px;">
        </div>
      </div>
      <div class="column is-6">
        <label class="label">Partenza Domenica</label>
        <div id="check_sunday" class="control p-2" style="background: #f8f9fa; border-radius: 5px;">
        </div>
      </div>
    </div>

    <!-- ===================== AMMINISTRAZIONE ===================== -->
    <div class="section-title">Amministrazione</div>
    <div class="columns mt-1">
      <div class="column is-4">
        <label class="label">Numero Polizza</label>
        <input class="input" id="f_policy" style="background:#fff9c4">
      </div>
      <div class="column is-4">
        <label class="label">Numero Tessera</label>
        <input class="input" id="f_cardNumber" style="background:#fff9c4" placeholder="Es. 2024-0001">
      </div>
      <div class="column is-4">
        <label class="label">Acconto Versato (€)</label>
        <input class="input" type="number" id="f_deposit" value="0" oninput="calc()">
      </div>
    </div>

    <!-- ===================== PAGAMENTO / CAPOFAMIGLIA ===================== -->
    <div class="section-title">
      Pagamento Familiare
      <button type="button" id="btnEnablePayer" class="button is-success is-small is-pulled-right"
              onclick="enablePayerSection()" style="margin-top:-2px;">
        ➕ AGGIUNGI PAGANTE
      </button>
    </div>

    <div id="payerSection" class="payer-section-disabled">
      <div class="columns mt-1">
        <div class="column is-8">
          <label class="label">
            Pagato da
            <span class="tag is-light ml-2" style="font-weight:normal;text-transform:none;">cerca il capofamiglia che effettua il pagamento</span>
          </label>
          <div class="field has-addons mb-0">
            <div class="control is-expanded">
              <input class="input" id="f_payerDisplay"
                     placeholder="Cerca capofamiglia per cognome..."
                     oninput="filterPayer()"
                     autocomplete="off"
                     disabled>
            </div>
            <div class="control">
              <button type="button" class="button is-light" onclick="clearPayer()" title="Rimuovi pagante" disabled>✕</button>
            </div>
          </div>
          <input type="hidden" id="f_payerCode">
          <div id="payerResults" style="max-height:160px;overflow-y:auto;"></div>
          <p id="payerConfirm" class="help is-success" style="display:none;"></p>
        </div>
      </div>
    </div>

    <!-- Pannello familiari a carico (visibile solo quando si modifica un capofamiglia) -->
    <div id="familyPanel" style="display:none;">
      <div class="family-title">👨‍👩‍👧 Familiari a carico — pagati da questo socio</div>
      <div id="familyList" class="mt-2"></div>
    </div>

  </form>
</div>

<!-- ===================== FOOTER TOTALI ===================== -->
<div class="total-box">
  <div class="container">
    <div class="columns is-mobile is-vcentered">
      <div class="column has-text-centered"><span class="val-label">Totale</span><span class="val-amount"><span id="v_total">0</span>€</span></div>
      <div class="column has-text-centered"><span class="val-label">Residuo</span><span class="val-amount val-residuo"><span id="v_balance">0</span>€</span></div>
      <div class="column is-5"><button onclick="save()" class="button is-warning is-large is-fullwidth has-text-weight-bold" id="btnSave" style="white-space: normal; height: auto;">SALVA E INVIA EMAIL</button></div>
    </div>
  </div>
</div>

<script>
  let DB = [];
  let PRICES = {};
  let FAMILY_TOTALS = { total: 0, deposit: 0 };
  // ===================== INIT =====================
  window.onload = () => {
    document.getElementById('loader').style.display = 'flex';
    google.script.run.withSuccessHandler(res => {
      PRICES = res;
      populateOptions("f_membership", "TESSERA");
      populateOptions("f_family", "FAMIGLIA");
      populateOptions("f_subscription", "ABBONAMENTO");
      populateOptions("f_course", "CORSO");

      document.getElementById('loader').style.display = 'none';
      google.script.run.withSuccessHandler(depRes => {
        populateDepartures(depRes);
        document.getElementById('loader').style.display = 'none';
      }).getDepartures();

    }).getPrices();
  };

  function populateOptions(id, cat) {
    let s = document.getElementById(id);
    s.innerHTML = id === "f_membership"
      ? '<option value="" disabled selected>-- Seleziona --</option>'
      : '<option value="0">Nessuna opzione</option>';
    PRICES[cat].forEach(p => {
      let o = document.createElement('option');
      o.value = p.price;
      o.text = p.name + " (" + p.price + "€)";
      s.add(o);
    });
  }
  function populateDepartures(data) {
    const satBox = document.getElementById('check_saturday');
    const sunBox = document.getElementById('check_sunday');

    // Svuota i contenitori (opzionale se sono già vuoti)
    satBox.innerHTML = "";
    sunBox.innerHTML = "";

    // Genera i checkbox per Sabato
    data.SABATO.forEach(luogo => {
      satBox.innerHTML += `
        <label class="checkbox mr-3">
          <input type="checkbox" value="${luogo}"> ${luogo}
        </label>`;
    });

    // Genera i checkbox per Domenica
    data.DOMENICA.forEach(luogo => {
      sunBox.innerHTML += `
        <label class="checkbox mr-3">
          <input type="checkbox" value="${luogo}"> ${luogo}
        </label>`;
    });
  }
  // ===================== RICERCA SOCI =====================
  function showSearch() {
    document.getElementById('searchZone').style.display = 'block';
    document.getElementById('searchInput').focus();
    if (DB.length === 0) {
      loadDatabase();
    }
  }

  function loadDatabase(callback) {
    document.getElementById('loader').style.display = 'flex';
    google.script.run.withSuccessHandler(res => {
      DB = res;
      document.getElementById('loader').style.display = 'none';
      if (callback) callback();
    }).getMembers();
  }

  function matchQuery(fullName, q) {
    const terms = q.split(/\s+/).filter(t => t.length > 0);
    const name = fullName.toLowerCase();
    return terms.every(t => name.includes(t));
  }

  function filterDb() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const box = document.getElementById('searchResults');
    if (q.length < 2) { box.innerHTML = ""; return; }
    if (DB.length === 0) { box.innerHTML = '<p class="help">Caricamento in corso...</p>'; return; }
    const res = DB.filter(s =>
      matchQuery(s.lastName + " " + s.firstName, q) ||
      s.taxCode.toLowerCase().includes(q)
    ).slice(0, 6);
    box.innerHTML = res.map(s =>
      `<div class="result-item box p-2 mb-1" onclick='loadMember(${JSON.stringify(s)})'>
         <strong>${s.lastName} ${s.firstName}</strong>
         ${s.cardNumber ? '<span class="tag is-info is-light ml-2">N° ' + s.cardNumber + '</span>' : ''}
       </div>`
    ).join('');
  }

  // ===================== CARICA SOCIO =====================
  function loadMember(s) {
    document.getElementById('f_row').value = s.row;
    document.getElementById('f_id_hidden').value = s.id || "";
    document.getElementById('f_lastName').value = s.lastName;
    document.getElementById('f_firstName').value = s.firstName;
    document.getElementById('f_taxCode').value = s.taxCode;
    document.getElementById('f_birthDate').value = s.birthDate || "";
    document.getElementById('f_address').value = s.address;
    document.getElementById('f_city').value = s.city;
    document.getElementById('f_prov').value = s.prov;
    document.getElementById('f_cap').value = s.cap;
    document.getElementById('f_phone').value = s.phone;
    document.getElementById('f_email').value = s.email;
    document.getElementById('f_birthPlace').value = s.birthPlace || "";
    document.getElementById('f_birthProv').value = s.birthProv || "";
    document.getElementById('f_policy').value = s.policy || "";
    document.getElementById('f_deposit').value = s.deposit || 0;
    document.getElementById('f_payerCode').value = s.payerCode || "";

    // NUOVO: numero tessera
    document.getElementById('f_cardNumber').value = s.cardNumber || "";

    // NUOVO: pagante (capofamiglia) - ABILITA LA SEZIONE SE C'È UN PAGANTE
    if (s.payerCode) {
      enablePayerSection();
      // Cerchiamo nel DB il socio che ha come ID il payerCode del socio corrente
      const payer = DB.find(m => m.id === s.payerCode);
      document.getElementById('f_payerDisplay').value = payer
        ? payer.lastName + " " + payer.firstName
        : "ID Pagante: " + s.payerCode;
      showPayerConfirm(document.getElementById('f_payerDisplay').value);
    } else {
      disablePayerSection();
    }

    ["f_membership", "f_family", "f_subscription", "f_course"].forEach(id => {
      let sel = document.getElementById(id);
      let val = s[id.split('_')[1]];
      sel.selectedIndex = 0;
      for (let i = 0; i < sel.options.length; i++) {
        const optName = sel.options[i].text.split(' (')[0].trim().toLowerCase();
        const valNorm = val.toString().trim().toLowerCase();
        if (val && optName === valNorm) { sel.selectedIndex = i; break; }
      }
    });

    document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
    if (s.saturday) s.saturday.split(', ').forEach(v => {
      let el = document.querySelector(`#check_saturday input[value="${v}"]`);
      if (el) el.checked = true;
    });
    if (s.sunday) s.sunday.split(', ').forEach(v => {
      let el = document.querySelector(`#check_sunday input[value="${v}"]`);
      if (el) el.checked = true;
    });

    document.getElementById('btnSave').innerText = "SALVA LE MODIFICHE";
    calc();
    document.getElementById('searchZone').style.display = 'none';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';

    // NUOVO: mostra pannello familiari a carico (questo socio paga per altri?)
    loadFamilyPanel(s.id);

    window.scrollTo(0, 0);
  }

  // ===================== CALCOLO TOTALE =====================
  function calc() {
<!--    const t = (parseInt(document.getElementById('f_membership').value) || 0) +-->
<!--              (parseInt(document.getElementById('f_family').value) || 0) +-->
<!--              (parseInt(document.getElementById('f_subscription').value) || 0) +-->
<!--              (parseInt(document.getElementById('f_course').value) || 0);-->
    const individualTotal = (parseInt(document.getElementById('f_membership').value) || 0) +
                            (parseInt(document.getElementById('f_family').value) || 0) +
                            (parseInt(document.getElementById('f_subscription').value) || 0) +
                            (parseInt(document.getElementById('f_course').value) || 0);

    const individualDeposit = parseInt(document.getElementById('f_deposit').value) || 0;
    // Somma socio corrente + familiari a carico
    const grandTotal = individualTotal + FAMILY_TOTALS.total;
    const grandDeposit = individualDeposit + FAMILY_TOTALS.deposit;
    const grandBalance = grandTotal - grandDeposit;

    // Aggiornamento interfaccia
    document.getElementById('v_total').innerText = grandTotal;
    document.getElementById('v_balance').innerText = grandBalance;

    const balanceEl = document.getElementById('v_balance').parentElement;
    if (grandBalance > 0) {
      balanceEl.style.color = "#ffca28";
    } else {
      balanceEl.style.color = "#25d366"; // Verde se tutto pagato
    }
<!--    const d = parseInt(document.getElementById('f_deposit').value) || 0;-->
<!--    document.getElementById('v_total').innerText = t;-->
<!--    document.getElementById('v_balance').innerText = t - d;-->
  }

  // ===================== GESTIONE SEZIONE PAGANTE =====================
  function enablePayerSection() {
    // Carica il DB se non è già stato caricato
    if (DB.length === 0) {
      loadDatabase(() => {
        activatePayerSection();
      });
    } else {
      activatePayerSection();
    }
  }

  function activatePayerSection() {
    const section = document.getElementById('payerSection');
    section.classList.remove('payer-section-disabled');
    document.getElementById('f_payerDisplay').disabled = false;
    document.querySelectorAll('#payerSection button').forEach(btn => btn.disabled = false);
    document.getElementById('btnEnablePayer').style.display = 'none';
    showToast("Sezione pagante abilitata. Cerca il capofamiglia.", "is-info");
  }

  function disablePayerSection() {
    const section = document.getElementById('payerSection');
    section.classList.add('payer-section-disabled');
    document.getElementById('f_payerDisplay').disabled = true;
    document.getElementById('f_payerDisplay').value = "";
    document.getElementById('f_payerCode').value = "";
    document.querySelectorAll('#payerSection button').forEach(btn => btn.disabled = true);
    document.getElementById('payerResults').style.display = 'none';
    document.getElementById('payerConfirm').style.display = 'none';
    document.getElementById('btnEnablePayer').style.display = 'inline-block';
  }

  // ===================== RICERCA PAGANTE (CAPOFAMIGLIA) =====================
 // ===================== RICERCA PAGANTE (CAPOFAMIGLIA) =====================
function filterPayer() {
  const q = document.getElementById('f_payerDisplay').value.toLowerCase().trim();
  const box = document.getElementById('payerResults');
  document.getElementById('f_payerCode').value = "";
  document.getElementById('payerConfirm').style.display = 'none';

  if (q.length < 2 || DB.length === 0) { box.style.display = 'none'; return; }

  const currentId = document.getElementById('f_id_hidden').value;
  const res = DB.filter(s =>
    matchQuery(s.lastName + " " + s.firstName, q) &&
    s.id !== currentId
  ).slice(0, 6);

  if (res.length === 0) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = res.map(s =>
    // NOTA: Qui passiamo s.id invece di s.taxCode
    `<div class="result-item box p-2 mb-1" onclick='selectPayer("${s.id}", "${s.lastName} ${s.firstName}")'>
       <strong>${s.lastName} ${s.firstName}</strong>
       <span class="tag is-light ml-2">${s.taxCode || 'No CF'}</span>
     </div>`
  ).join('');
}

function selectPayer(id, name) {
  document.getElementById('f_payerCode').value = id; // Salviamo l'ID univoco
  document.getElementById('f_payerDisplay').value = name;
  document.getElementById('payerResults').style.display = 'none';
  showPayerConfirm(name);
}

  function showPayerConfirm(name) {
    const p = document.getElementById('payerConfirm');
    p.textContent = "✔ Pagante selezionato: " + name;
    p.style.display = 'block';
  }

  function clearPayer() {
    document.getElementById('f_payerCode').value = "";
    document.getElementById('f_payerDisplay').value = "";
    document.getElementById('payerResults').style.display = 'none';
    document.getElementById('payerConfirm').style.display = 'none';
  }

  /// ===================== PANNELLO FAMILIARI A CARICO =====================
function loadFamilyPanel(memberId) {
  const panel = document.getElementById('familyPanel');
  const list = document.getElementById('familyList');

  // memberId è l'ID del socio corrente (che potrebbe essere un capofamiglia)
  if (!memberId || DB.length === 0) {
    panel.style.display = 'none';
    FAMILY_TOTALS = { total: 0, deposit: 0 };
    return;
  }

  // Cerchiamo tutti i soci che hanno l'ID di questo socio nel campo payerCode
  const members = DB.filter(s => s.payerCode && s.payerCode.trim() === memberId.trim());

  if (members.length === 0) {
    panel.style.display = 'none';
    FAMILY_TOTALS = { total: 0, deposit: 0 };
    calc();
    return;
  }

  FAMILY_TOTALS.total = members.reduce((sum, s) => sum + (parseFloat(s.total) || 0), 0);
  FAMILY_TOTALS.deposit = members.reduce((sum, s) => sum + (parseFloat(s.deposit) || 0), 0);
  const balanceFamily = FAMILY_TOTALS.total - FAMILY_TOTALS.deposit;

  list.innerHTML = `
    <table class="table is-fullwidth is-striped is-hoverable is-size-7 mt-2">
      <thead>
        <tr style="background:#e8f5e9;">
          <th>Cognome Nome</th>
          <th>N° Tessera</th>
          <th style="text-align:right">Totale</th>
          <th style="text-align:right">Saldo</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${members.map(s => `
          <tr>
            <td><strong>${s.lastName} ${s.firstName}</strong></td>
            <td>${s.cardNumber || "—"}</td>
            <td style="text-align:right">${s.total || 0}€</td>
            <td style="text-align:right;font-weight:bold;color:${parseFloat(s.balance) > 0 ? '#d9534f' : '#198754'}">
              ${s.balance || 0}€
            </td>
            <td>
              <button type="button" class="button is-small is-link is-light" onclick='loadMember(${JSON.stringify(s)})'>
                Modifica
              </button>
            </td>
          </tr>`).join('')}
      </tbody>
      <tfoot>
        <tr style="background:#d4edda;font-weight:bold;">
          <td colspan="2">TOTALE NUCLEO (${members.length} familiari)</td>
          <td style="text-align:right">${FAMILY_TOTALS.total}€</td>
          <td style="text-align:right;color:${balanceFamily > 0 ? '#d9534f' : '#198754'}">${balanceFamily}€</td>
          <td></td>
        </tr>
      </tfoot>
    </table>`;

  panel.style.display = 'block';
  calc();
}

  // ===================== RESET FORM =====================
  function resetForm() {
    document.getElementById('memberForm').reset();
    document.getElementById('f_row').value = "";
    document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
    document.getElementById('btnSave').innerText = "SALVA E INVIA EMAIL";
    FAMILY_TOTALS = { total: 0, deposit: 0 };
    document.getElementById('searchZone').style.display = 'none';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';
    // NUOVO: reset campi aggiuntivi e DISABILITA sezione pagante
    document.getElementById('f_cardNumber').value = "";
    disablePayerSection();
    document.getElementById('familyPanel').style.display = 'none';

    calc();
    window.scrollTo(0, 0);
  }

  // ===================== TOAST NOTIFICA =====================
  function showToast(msg, type = "is-success") {
    const t = document.getElementById('statusToast');
    t.innerText = msg;
    t.className = `notification ${type}`;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  // ===================== SALVATAGGIO =====================
  function save() {
    const form = document.getElementById('memberForm');
    if (!form.checkValidity()) { form.reportValidity(); return; }

    const btn = document.getElementById('btnSave');
    const sendEmail = btn.innerText.includes("INVIA EMAIL");
    btn.disabled = true;
    document.getElementById('loader').style.display = 'flex';

    const rawDate = document.getElementById('f_birthDate').value;
    let dateForSheet = "";
    if (rawDate) {
      const [y, m, d] = rawDate.split('-');
      dateForSheet = `${m}/${d}/${y}`;
    }

    const getT = (id) => {
      let e = document.getElementById(id);
      return e.selectedIndex > 0 ? e.options[e.selectedIndex].text.split(" (")[0] : "No";
    };
    const getChecks = (id) => {
      return Array.from(document.querySelectorAll(`#${id} input:checked`))
        .map(c => c.value).join(', ') || "No";
    };

    const data = {
      row: document.getElementById('f_row').value,
      id: document.getElementById('f_id_hidden') ? document.getElementById('f_id_hidden').value : "",
      lastName: document.getElementById('f_lastName').value.toUpperCase(),
      firstName: document.getElementById('f_firstName').value.toUpperCase(),
      taxCode: document.getElementById('f_taxCode').value.toUpperCase(),
      birthDate: dateForSheet,
      phone: document.getElementById('f_phone').value,
      email: document.getElementById('f_email').value,
      birthPlace: document.getElementById('f_birthPlace').value.toUpperCase(),
      birthProv: document.getElementById('f_birthProv').value.toUpperCase(),
      address: document.getElementById('f_address').value.toUpperCase(),
      city: document.getElementById('f_city').value.toUpperCase(),
      prov: document.getElementById('f_prov').value.toUpperCase(),
      cap: document.getElementById('f_cap').value,
      membership: getT('f_membership'),
      family: getT('f_family'),
      subscription: getT('f_subscription'),
      course: getT('f_course'),
      sunday: getChecks('check_sunday'),
      saturday: getChecks('check_saturday'),
      total: (parseInt(document.getElementById('f_membership').value) || 0) +
             (parseInt(document.getElementById('f_family').value) || 0) +
             (parseInt(document.getElementById('f_subscription').value) || 0) +
             (parseInt(document.getElementById('f_course').value) || 0),
      deposit: parseInt(document.getElementById('f_deposit').value) || 0,
      get balance() { return this.total - this.deposit; },
      balance: document.getElementById('v_balance').innerText,
      policy: document.getElementById('f_policy').value,
      // NUOVO
      cardNumber: document.getElementById('f_cardNumber').value,
      payerCode: document.getElementById('f_payerCode').value,
      sendEmail: sendEmail
    };

    google.script.run.withSuccessHandler(res => {
      document.getElementById('loader').style.display = 'none';
      showToast(res);
      resetForm();
      btn.disabled = false;
      DB = []; // Svuota cache DB per forzare ricaricamento aggiornato
    }).saveMember(data);
  }
</script>
</body>
