name: Deploy pagine su GitHub Pages

# Pubblica due siti sulla stessa GitHub Pages:
#   web/     -> radice del sito (il gestionale)
#   ricerca/ -> sottocartella /ricerca/ (solo la ricerca dei soci)
#
# Sono due applicazioni separate: non si linkano fra loro e non condividono
# file. Vivono sullo stesso dominio perché un repository ha una sola Pages.
#
# Prerequisito da fare una volta a mano:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
#
# Le credenziali Supabase (URL e chiave anon) non sono segreti: stanno in
# web/config.js. Se si preferisce tenerle fuori dal repository, impostare le
# variabili di repository SUPABASE_URL e SUPABASE_ANON_KEY
# (Settings > Secrets and variables > Actions > Variables): se presenti,
# sovrascrivono config.js in fase di deploy.

on:
  push:
    branches: ["2.0"]
    paths:
      - "web/**"
      - "ricerca/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; non annulla quello in corso per non lasciare
# la pagina pubblicata a metà.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrivi i config.js dalle variabili di repository (se impostate)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            for dir in web ricerca; do
              cat > $dir/config.js <<EOF
          window.SUPABASE_CONFIG = {
            url: "$SUPABASE_URL",
            anonKey: "$SUPABASE_ANON_KEY",
          };
          EOF
            done
            echo "config.js generati dalle variabili di repository"
          else
            echo "Variabili non impostate: uso i config.js versionati"
          fi

      - name: Verifica che i config.js siano compilati
        run: |
          for file in web/config.js ricerca/config.js; do
            if grep -q "IL-TUO-PROGETTO" $file; then
              echo "::error::$file contiene ancora i valori segnaposto."
              echo "::error::Compila il file oppure imposta le variabili SUPABASE_URL e SUPABASE_ANON_KEY."
              exit 1
            fi
          done

      - name: Controlla la ricerca soci
        run: node ricerca/test-ricerca.js

      # I due siti finiscono in un'unica cartella: web/ alla radice, ricerca/
      # sotto /ricerca/.
      - name: Prepara il pacchetto da pubblicare
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r web/. _site/
          cp -r ricerca _site/ricerca
          rm -f _site/ricerca/test-ricerca.js

      # enablement: attiva GitHub Pages se non lo è già, invece di fallire con
      # "Get Pages site failed". Non sostituisce la regola sui branch: quella
      # va impostata a mano in Settings > Environments > github-pages, dove il
      # branch di deploy va autorizzato esplicitamente.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
