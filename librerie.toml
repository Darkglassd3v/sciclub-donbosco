# Librerie esterne copiate nel sito, in web/vendor/.
#
# Il sito non dipende da file su altri server: una copia sparita o cambiata altrove non lo
# rompe. Ogni sezione è un file copiato, col pacchetto npm da cui viene e la versione in uso;
# nel sito si chiama <sezione>-<versione>.js. Per aggiornarne uno:
#
#   python3 strumenti/aggiorna-libreria.py codice-fiscale-utils            # ultima versione
#   python3 strumenti/aggiorna-libreria.py codice-fiscale-utils 3.1.4      # versione precisa
#
# Lo script scarica il pacchetto da npm, ne verifica l'impronta, sostituisce il file in
# web/vendor/, aggiorna le pagine che lo caricano e la versione qui sotto. Poi vanno lanciate
# le prove (bash test-browser/esegui.sh) prima del commit: le librerie si appoggiano l'una
# all'altra (dayjs sotto tutte), e una versione nuova può cambiare i nomi che si aspettano.
# dayjs e dayjs-utc vengono dallo stesso pacchetto: si aggiornano insieme, alla stessa versione.
#
# Campi: package, il pacchetto npm; version, la versione in uso; file, il file del pacchetto da
# copiare; licenses, i file di licenza da copiare accanto (<sezione>-<nome del file>); pages, le
# pagine che caricano il file.
#
# Codice fiscale e comuni (pagine Soci e Assicurazione): librerie di Marco Ricupero, licenza MIT.
# L'elenco di comuni e stati esteri, con le date in cui sono esistiti, viene da Agenzia delle
# Entrate e Ministero dell'Interno (CC BY 4.0) e ISTAT (CC BY 3.0).

[dayjs]
package = "dayjs"
version = "1.11.23"
file = "dayjs.min.js"
licenses = ["LICENSE"]
pages = ["web/index.html", "web/assicurazione.html"]

[dayjs-utc]
package = "dayjs"
version = "1.11.23"
file = "plugin/utc.js"
licenses = []
pages = ["web/index.html", "web/assicurazione.html"]

[belfiore-connector]
