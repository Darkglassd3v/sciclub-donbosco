file = "dist/belfiore-abstract-connector.bundle.min.js"
licenses = ["LICENSE"]
pages = ["web/index.html", "web/assicurazione.html"]

[belfiore-connector-embedded]
package = "@marketto/belfiore-connector-embedded"
