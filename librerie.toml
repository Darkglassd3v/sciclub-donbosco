licenses = ["LICENSE", "asset/AGENZIA_DELLE_ENTRATE.LICENSE", "asset/MINISTERO_DELL_INTERNO.LICENSE", "asset/ISTITUTO_NAZIONALE_DI_STATISTICA.LICENSE"]
pages = ["web/index.html", "web/assicurazione.html"]

[diacritic-remover]
