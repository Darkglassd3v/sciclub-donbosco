<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Confronto grafiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tavola per il direttivo: lo stesso contenuto nelle tre grafiche, affiancate.
 * Ogni canvas è templates.html in un iframe scalato, così non si duplica niente.
 * ?caso=<chiave di CASI> mostra un caso solo (per l'export PNG di export.sh). */
* { box-sizing: border-box; margin: 0; }
body { font-family: Barlow, system-ui, sans-serif; background: #F5F5F7; color: #14202E; padding: 48px; }
h1 { font-size: 44px; letter-spacing: -.02em; }
p.lead { font-size: 22px; color: #5B6472; margin-top: 8px; max-width: 1100px; }
section { margin-top: 56px; }
section h2 { font-size: 32px; letter-spacing: -.02em; margin-bottom: 20px; }
.row { display: flex; gap: 40px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 14px; }
.lab { display: flex; align-items: baseline; gap: 12px; }
.lab b { font-size: 56px; font-weight: 800; line-height: 1; color: #084C8D; }
.lab span { font-size: 22px; font-weight: 600; color: #5B6472; }
.frame { overflow: hidden; border-radius: 14px; box-shadow: 0 10px 30px rgba(20,32,46,.14); background: #fff; }
.frame iframe { border: 0; transform-origin: 0 0; display: block; }
body.single { padding: 40px; }
body.single section { margin-top: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const DIRS = [['a', 'Linea'], ['b', 'Vetta'], ['c', 'Skipass']];
const SIZE = { post: [1080, 1080], story: [1080, 1920], cover: [820, 312] };
const SCALE = { post: .42, story: .3, cover: .6 };

/* Un caso = un contenuto e un formato, mostrato nelle tre grafiche. */
const CASI = {
  'gita-post':   ['Gita · post', 'gita-mar', 'post'],
  'gita-story':  ['Gita · story', 'gita-mar', 'story'],
  'corso-post':  ['Gita con corso nello stesso giorno', 'gita-dom', 'post'],
  'evento-post': ['Evento senza data (corsi, servizi)', 'corso', 'post'],
  'cena-post':   ['Cena', 'cena', 'post'],
  'cal-post':    ['Calendario del mese', 'cal', 'post'],
  'cover':       ['Copertina Facebook', 'cover', 'cover'],
};

function caso([titolo, tpl, fmt]) {
  const [w, h] = SIZE[fmt], k = SCALE[fmt];
  return `<section><h2>${titolo}</h2><div class="row">${DIRS.map(([d, nome]) => `
    <div class="col"><div class="lab"><b>${d.toUpperCase()}</b><span>${nome}</span></div>
      <div class="frame" style="width:${w * k}px;height:${h * k}px">
        <iframe src="templates.html?dir=${d}&tpl=${tpl}&fmt=${fmt}" width="${w}" height="${h}" style="transform:scale(${k})" scrolling="no"></iframe>
      </div></div>`).join('')}</div></section>`;
}

const solo = new URLSearchParams(location.search).get('caso'), root = document.getElementById('root');
if (solo) {
  document.body.className = 'single';
  root.innerHTML = caso(CASI[solo]);
} else {
  root.innerHTML = `<h1>Post social · quale grafica?</h1>
    <p class="lead">Lo stesso contenuto nelle tre proposte. Il colore segue il giorno della gita, come nel gestionale.
      Nella C la data è scritta 13/01; nella A e nella B 13 gennaio.</p>` + Object.values(CASI).map(caso).join('');
}
</script>
</body>
</html>
