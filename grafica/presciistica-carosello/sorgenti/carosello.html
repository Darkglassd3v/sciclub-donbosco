<!doctype html>
<!-- Carosello della ginnastica presciistica per Instagram e Facebook, tre pagine 1080×1350: la copertina col
     logo su fondo blu, il post disegnato con le funzioni del generatore (web/social-templates.js, grafica
     K · Piani) e il finale del video della stagione. Si sceglie la pagina con l'hash (#1…#3); le immagini le
     rifà rendi.sh. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Carosello presciistica</title>
  <!-- Gli stessi fogli della pagina del generatore (web/social.html), così i testi hanno le stesse misure. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="../../../web/brand.css">
  <link rel="stylesheet" href="../../font/barlow/barlow.css">
  <link rel="stylesheet" href="../../font/barlow-condensed/barlow-condensed.css">
  <style>
    html, body { margin: 0; background: #084C8D; overflow: hidden; }
    .pagina { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; background: #084C8D; }

    /* Copertina: il logo del post «Don Bosco mode: on» a tutta larghezza; il suo cerchio ha lo stesso blu del fondo. */
    #logo-grande { position: absolute; left: 0; top: 135px; width: 1080px; height: 1080px; }

    /* Invito a scorrere, uguale in copertina e nel post: una linguetta rossa (quella delle gite del martedì) appesa al bordo destro, con l'angolo tagliato come la tessera. */
    .scorri { position: absolute; right: 0; bottom: 40px; font-family: Barlow, sans-serif; width: 250px; padding: 16px 24px 18px 36px; background: #B3261E; color: #fff;
      clip-path: polygon(28px 0, 100% 0, 100% 100%, 0 100%, 0 28px); font-size: 54px; font-weight: 800; line-height: 1; letter-spacing: -.01em; }
    .scorri svg { display: block; width: 190px; height: 56px; margin-top: 8px; }

    /* Finale: le misure di grafica/video-stagione/compositions/frames/05-seguici.html, sul formato del post. */
    #bosco { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #velo { position: absolute; inset: 0; background: rgba(8, 76, 141, .88); }
    #luce { position: absolute; left: 140px; top: -105px; width: 800px; height: 800px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, .38) 0%, rgba(255, 255, 255, .12) 38%, rgba(255, 255, 255, 0) 68%); }
    #colonna { position: absolute; left: 64px; right: 64px; top: 135px; display: flex; flex-direction: column; align-items: center; }
    #logo-anello { width: 340px; height: 340px; display: block; border-radius: 50%;
      box-shadow: 0 0 0 12px #fff, 0 0 0 18px #FCCF02, 0 16px 40px rgba(0, 0, 0, .4); }
    #seguici { margin-top: 40px; font: 800 230px/.85 "Barlow Condensed", sans-serif; color: #FCCF02; text-transform: uppercase; }
    #sotto { margin-top: 18px; font: 700 60px/1.15 Barlow, sans-serif; text-align: center; }
    #social { margin-top: 64px; display: flex; flex-direction: column; gap: 30px; align-self: stretch; padding-left: 70px; }
    .riga { display: flex; align-items: center; gap: 30px; font: 700 56px/1 Barlow, sans-serif; }
    /* Loghi ufficiali (Simple Icons 16.34.0) nei colori del marchio, su un tassello bianco */
    .icona { width: 104px; height: 104px; flex: none; border-radius: 28px; background: #fff; display: flex; align-items: center; justify-content: center; }
    .icona svg { width: 68px; height: 68px; display: block; }
  </style>
</head>
<body>
  <script src="../../../web/social-templates.js"></script>
  <script>
    SOCIAL.logoTondo = "../../../web/logo-ufficiale-blu-tondo.svg";

    const SCORRI = `<div class="scorri">Scorri<svg viewBox="0 0 150 44" aria-hidden="true"><path d="M8 6l16 16L8 38M58 6l16 16-16 16M108 6l16 16-16 16"
      fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;

    const COVER = `<div class="pagina">
      <img id="logo-grande" src="../../../web/logo-ufficiale-blu-tondo.svg" alt="Sci Club Don Bosco Asti">
      ${SCORRI}
    </div>`;

    // La tessera ha la stessa struttura di cardK(), con il «quando» che vale tutte le settimane.
    const OGNI = `<div class="tessera"><b data-fit style="font-size:124px">ogni</b>
      <span data-fit style="font-size:66px">mercoledì</span><em data-fit style="font-size:58px">ore 19:30</em></div>`;
    // Gancio, titolo e dati con la stessa struttura di postK().
    const POST = bgK({ giallo: true, foto: "foto-palestra.jpg", pos: "50% 100%", zoom: 1.2 }, OGNI + SCORRI,
      `<div class="testo" data-adatta=".6"><div class="gancio">Riservata ai soci</div>
        <div class="tit" data-cede><div data-righe="2" style="--t:116px">Ginnastica Presciistica</div></div>
        <div class="fatti"><p>${highlight("Tutti i mercoledì fino al *13 gennaio*\n(escluso periodo natalizio)\nSoli soci *tesserati e assicurati*", false)}</p>
        <p class="dove">${icoPin}<span>Palestra Way Assauto, Asti</span></p></div></div>`, enrolments());

        <div id="seguici">Seguici</div>

              <span>@sciclubdonbosco_asti</span>
            </div>
            <div class="riga">
              <span class="icona"><svg viewBox="0 0 24 24" role="img" aria-label="Facebook"><path fill="#0866FF" d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z" /></svg></span>
              <span>Sci Club Don Bosco Asti</span>

              <span>Canale WhatsApp</span>
            </div>
        </div>
      </div>
    </div>`;

    const page = Number(location.hash.slice(1)) || 1;
    document.body.insertAdjacentHTML("afterbegin", [COVER, POST, OUTRO][page - 1]);
    document.fonts.ready.then(() => {
      if (fit(document.body)) console.error("testo troppo lungo nella pagina", page);
    });
  </script>
</body>
</html>
