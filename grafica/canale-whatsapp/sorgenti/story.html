<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<title>Story del canale WhatsApp</title>
<link rel="stylesheet" href="../../font/barlow/barlow.css">
<!--
  La story (1080×1920) che invita a seguire il canale WhatsApp, nello stile K · Piani
  dei post: foto in alto, angolo blu, cuneo giallo, Barlow 800, scritte grandi per chi
  vede poco. Il link scritto in un'immagine non si tocca: su Instagram e Facebook si
  apre solo con lo sticker link, che chi pubblica mette nell'app dentro il riquadro
  blu col bordo giallo, indicato dalla freccia «TOCCA QUI». Il riquadro resta vuoto
  apposta. Le fasce di Instagram (in alto 250 px, in basso 300 px) non coprono scritte.
  Foto: pista a La Thuile di DimiTalen, Wikimedia Commons, CC0.
-->
<style>
  html, body { margin: 0; background: #14202E; }
  .cv { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff;
        background: #14202E; font-family: Barlow, sans-serif; letter-spacing: -.01em; }
  .cv * { box-sizing: border-box; margin: 0; }
  /* La foto è larga 1080: alta 1100 non si sgrana troppo, e sotto il fondo è già scuro. */
  .foto { position: absolute; left: 0; right: 0; top: 0; height: 1100px;
          background: url(../../proposte-post-social/sorgenti/foto/calendario-montagna.jpg) center 40% / cover; }
  .scuro { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,32,46,.15) 0, rgba(20,32,46,.55) 520px, rgba(20,32,46,.94) 900px, #14202E 1100px); }
  .angolo { position: absolute; inset: 0; background: rgba(8,76,141,.78); clip-path: polygon(0 0, 640px 0, 0 640px); }
  .cuneo { position: absolute; inset: 0; background: #FCCF02; clip-path: polygon(100% 1640px, 100% 1820px, 900px 1920px, 640px 1920px); opacity: .9; }
  /* Logo tondo ufficiale (cerchio bianco con l'anello giallo), sull'angolo blu, sotto la fascia di Instagram. */
  .logo { position: absolute; left: 60px; top: 250px; width: 220px; height: 220px; border-radius: 50%; box-shadow: 0 8px 26px rgba(0,0,0,.45); }
  .testo { position: absolute; left: 60px; right: 60px; top: 490px; text-shadow: 0 2px 14px rgba(20,32,46,.6); }
  .gancio { font-size: 66px; font-weight: 800; font-style: italic; color: #FCCF02; }
  .tit { font-size: 116px; font-weight: 800; line-height: .92; letter-spacing: -.035em; margin-top: 10px; }
  .sub { font-size: 50px; font-weight: 600; line-height: 1.16; margin-top: 22px; max-width: 900px; }
  .sub b { background: #FCCF02; color: #084C8D; padding: 0 .18em; border-radius: 10px; text-shadow: none; }
  /* La freccia: un blocco giallo con «TOCCA QUI» e la punta che entra nel riquadro. */
  .freccia { position: absolute; left: 50%; top: 950px; transform: translateX(-50%); width: 560px; display: flex; flex-direction: column; align-items: center;
             filter: drop-shadow(0 8px 18px rgba(0,0,0,.5)); }
  .freccia .corpo { width: 560px; height: 130px; background: #FCCF02; color: #084C8D; border-radius: 26px 26px 0 0; display: flex; align-items: center;
                    justify-content: center; font-size: 84px; font-weight: 800; letter-spacing: .02em; }
  .freccia .punta { width: 0; height: 0; border-left: 200px solid transparent; border-right: 200px solid transparent; border-top: 120px solid #FCCF02; margin-top: -1px; }
  /* Il posto dello sticker: al centro, nella zona che Instagram non copre, comodo col pollice. */
  .pad { position: absolute; left: 70px; right: 70px; top: 1220px; height: 270px; border-radius: 40px; background: #084C8D; border: 12px solid #FCCF02;
         box-shadow: 0 0 0 10px rgba(252,207,2,.25), 0 10px 40px rgba(0,0,0,.45); }
  .passo { position: absolute; left: 60px; right: 60px; top: 1510px; font-size: 46px; font-weight: 700; white-space: nowrap;
           display: flex; align-items: center; justify-content: center; gap: .3em; }
  .passo b { color: #FCCF02; }
  .passo svg { width: 1.05em; height: 1.05em; fill: #FCCF02; flex: none; }
  .oppure { position: absolute; left: 40px; right: 40px; top: 1568px; font-size: 34px; white-space: nowrap; font-weight: 600; text-align: center; color: #DCE4EC; }
</style></head>
<body>
<div class="cv">
  <div class="foto"></div><div class="scuro"></div><div class="angolo"></div><div class="cuneo"></div>
  <img class="logo" src="../../logo/logo-ufficiale-tondo.svg" alt="Sci Club Don Bosco Asti">
  <div class="testo">
    <div class="gancio">Novità!</div>
    <div class="tit">Il nostro canale WhatsApp</div>
    <p class="sub">Gite, pullman e avvisi <b>sul telefono</b>.</p>
  </div>
  <div class="freccia"><div class="corpo">TOCCA QUI</div><div class="punta"></div></div>
  <div class="pad"></div>
  <p class="passo">Poi premi <b>«Segui»</b> e <b>attiva le notifiche</b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg></p>
  <p class="oppure">Oppure: WhatsApp › Aggiornamenti › «Sci Club Don Bosco»</p>
</div>
</body></html>
