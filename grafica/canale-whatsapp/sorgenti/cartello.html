<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Cartello canale WhatsApp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=block">
<style>
/* Cartello A4 da lasciare in negozio: il QR del canale WhatsApp, grande, nero
 * su bianco (si legge meglio di qualsiasi colore), con il logo del club. Il
 * verde di WhatsApp solo nella cornice: come testo sul bianco non si legge.
 * Misure in mm, stampa a margine zero (rendi.sh fa il PDF con Chrome). */
@page { size: A4; margin: 0; }
:root { --blu: #084C8D; --blu-dark: #06396A; --giallo: #FCCF02; --verde: #25D366; --testo: #14202E; --soft: #4A5361; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 210mm; height: 297mm; background: #fff; }
body { font-family: Barlow, system-ui, sans-serif; color: var(--testo); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.foglio { position: relative; width: 210mm; height: 297mm; overflow: hidden; display: flex; flex-direction: column; align-items: center; }

.logo { margin-top: 10mm; height: 34mm; }
.titolo { margin-top: 6mm; text-align: center; color: var(--blu); font-weight: 800; letter-spacing: -.03em; line-height: .95; font-size: 21mm; }
.sotto { margin-top: 3mm; text-align: center; font-size: 7.4mm; font-weight: 600; color: var(--soft); line-height: 1.2; }

.cornice { margin-top: 7mm; padding: 5mm; border: 3.4mm solid var(--verde); border-radius: 9mm; background: #fff; position: relative; }
.cornice img { display: block; width: 98mm; height: 98mm; }
/* Il fumetto sulla cornice: dice "chat" senza usare il marchio di WhatsApp. */
.fumetto { position: absolute; right: -11mm; top: -11mm; width: 24mm; height: 24mm; }

.passi { margin-top: 7mm; display: flex; gap: 7mm; }
.passi div { display: flex; align-items: center; gap: 2.6mm; font-size: 6mm; font-weight: 700; line-height: 1.05; }
.passi b { flex: none; width: 10mm; height: 10mm; border-radius: 50%; background: var(--blu); color: #fff; display: grid; place-items: center; font-size: 6mm; }

.piede { position: absolute; left: 0; right: 0; bottom: 0; background: var(--blu); color: #fff; text-align: center; padding: 6mm 10mm 7mm; }
.piede .club { font-size: 8mm; font-weight: 800; letter-spacing: -.01em; color: var(--giallo); }
.piede .link { font-size: 4.6mm; font-weight: 600; margin-top: 1.6mm; letter-spacing: .01em; }
</style>
</head>
<body>
<div class="foglio">
  <img class="logo" src="../../logo/logo_sciclubdonbosco.svg" alt="Sci Club Don Bosco">
  <div class="titolo">Seguici<br>su WhatsApp</div>
  <div class="sotto">Gite, iscrizioni e avvisi dell'ultimo minuto,<br>direttamente sul telefono.</div>
  <div class="cornice">
    <img src="qr-canale-whatsapp.svg" alt="Codice QR del canale WhatsApp dello Sci Club Don Bosco">
    <svg class="fumetto" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 3C12.4 3 3 11.6 3 22.2c0 5.4 2.4 10.2 6.3 13.7L7.4 45l9.7-5.1c2.2.6 4.5 1 6.9 1 11.6 0 21-8.6 21-19.2S35.6 3 24 3Z" fill="#25D366" stroke="#fff" stroke-width="2.5"/>
      <path d="M17.2 14.6c.5 0 1 .1 1.3.8l1.6 3.7c.2.5.1 1-.2 1.4l-1.3 1.6c1.4 2.7 3.6 4.9 6.3 6.3l1.6-1.3c.4-.3.9-.4 1.4-.2l3.7 1.6c.7.3.8.8.8 1.3 0 2.6-2.1 4.3-4.5 4.3-8.2-.6-14.3-6.7-14.9-14.9 0-2.4 1.7-4.5 4.2-4.6Z" fill="#fff"/>
    </svg>
  </div>
  <div class="passi">
    <div><b>1</b>Apri la<br>fotocamera</div>
    <div><b>2</b>Inquadra<br>il codice</div>
    <div><b>3</b>Tocca<br>«Segui»</div>
  </div>
  <div class="piede">
    <div class="club">Sci Club Don Bosco ASD Asti</div>
    <div class="link">whatsapp.com/channel/0029Vb98yLKIt5s3Y7pk0V2C</div>
  </div>
</div>
</body>
</html>
