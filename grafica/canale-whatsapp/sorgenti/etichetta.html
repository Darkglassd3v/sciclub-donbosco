<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Etichetta QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=block">
<style>
/* Etichette col QR da mettere nel file del tesseramento come immagini:
 * #scheda (68×19 mm, accanto a "data / firma") e #ricevuta (72×30 mm, accanto a
 * "visto: per ricevuta", riga 23). Misure del foglio Excel: si stampa all'80%. */
:root { --blu: #084C8D; --soft: #4A5361; --verde: #25D366; }
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { background: #fff; }
body { font-family: Barlow, system-ui, sans-serif; color: #14202E; }
/* Fondo bianco pieno: col trasparente il PDF disegnava un filo grigio attorno al QR. */
.etichetta { display: flex; align-items: center; background: #fff; overflow: hidden; }
.qr { flex: none; display: block; }
.testo b { display: block; color: var(--blu); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.testo span { display: block; color: var(--soft); font-weight: 600; line-height: 1.2; }

.scheda, .ricevuta { gap: 2.5mm; justify-content: flex-end; }
.scheda .testo, .ricevuta .testo { text-align: right; }
.scheda { width: 68mm; height: 19mm; }
.scheda .testo b { font-size: 4.6mm; }
.scheda .testo span { font-size: 3.3mm; margin-top: .6mm; }
.scheda .qr { width: 19mm; height: 19mm; }
/* La ricevuta va al socio: stesso disegno, più grande. */
.ricevuta { width: 72mm; height: 30mm; }
.ricevuta .testo b { font-size: 4.8mm; }
.ricevuta .testo span { font-size: 3.6mm; margin-top: .8mm; }
.ricevuta .qr { width: 30mm; height: 30mm; }
</style>
</head>
<body>
<div class="etichetta scheda" id="scheda" hidden>
  <div class="testo"><b>Seguici su WhatsApp</b><span>gite e avvisi del club:<br>inquadra il codice</span></div>
  <img class="qr" src="qr-canale-whatsapp-piccolo.svg" alt="">
</div>
<div class="etichetta ricevuta" id="ricevuta" hidden>
  <div class="testo"><b>Canale WhatsApp</b><span>gite, iscrizioni<br>e avvisi del club:<br>inquadra il codice</span></div>
  <img class="qr" src="qr-canale-whatsapp.svg" alt="">
</div>
<script>document.getElementById(location.hash.slice(1) || "scheda").hidden = false;</script>
</body>
</html>
