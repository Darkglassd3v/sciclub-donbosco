<!doctype html>
<html lang="it" class="post">
<head>
<meta charset="utf-8">
<title>Calendario · C Manifesto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=block">
<link rel="stylesheet" href="../comune.css">
<link rel="stylesheet" href="c.css">
<!-- Calendario: blu del club con il giallo per gancio e nastro (categoria "cal"); le righe al posto del disegno. -->
<style>
html { --cat: #084C8D; --cat-ink: #fff; --gancio: #FCCF02; --nastro: #FCCF02; --nastro-ink: #06396A; }
.gancio { font-size: 136px; }
.nastro { font-size: 64px; margin-top: 34px; }
.righe { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 10px; margin-top: 26px; }
.righe div { display: flex; align-items: center; gap: 20px; }
.giorno { flex: none; width: 210px; text-align: center; border-radius: 999px; font-size: 36px; font-weight: 800; padding: 4px 0; border: 3px solid #fff; }
.meta { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
.corso { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 36px; font-weight: 800; color: var(--giallo); }
.corso svg { width: 44px; height: 44px; }
.dom { background: #FCCF02; color: #06396A; } .sab { background: #084C8D; color: #fff; } .mar { background: #B3261E; color: #fff; }
.iscrizioni b { color: var(--giallo); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="sciatore" viewBox="0 0 250 240">
  <rect x="4" y="208" width="242" height="16" rx="8" fill="currentColor"/>
  <g stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M120 70 L84 136"/><path d="M114 82 L192 92"/><path d="M84 136 L154 142 L140 206 L172 206"/></g>
  <circle cx="134" cy="38" r="27" fill="currentColor"/></symbol></svg>
<div class="cv">
  <div class="neve" data-neve=".14"></div>
  <div class="contenuto">
    <div class="testa">
      <div class="logo-box"><img src="../../../logo/logo-ufficiale-trasparente-lettere-blu.svg" alt="Sci Club Don Bosco"></div>
    </div>
    <div class="gancio">Gennaio<br>sulla neve!</div>
    <div class="nastro">Sei gite, quattro col corso</div>
    <div class="righe">
      <div><span class="giorno dom">Dom 10</span><span class="meta">Prato Nevoso</span><span class="corso"><svg><use href="#sciatore"/></svg>corso</span></div>
      <div><span class="giorno sab">Sab 16</span><span class="meta">Sestriere</span></div>
      <div><span class="giorno dom">Dom 17</span><span class="meta">La Thuile</span><span class="corso"><svg><use href="#sciatore"/></svg>corso</span></div>
      <div><span class="giorno mar">Mar 19</span><span class="meta">Courmayeur</span></div>
      <div><span class="giorno dom">Dom 24</span><span class="meta">Cervinia</span><span class="corso"><svg><use href="#sciatore"/></svg>corso</span></div>
      <div><span class="giorno dom">Dom 31</span><span class="meta">Pila</span><span class="corso"><svg><use href="#sciatore"/></svg>corso</span></div>
    </div>
    <div class="iscrizioni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3-8-5.3zM5.8 7 12 11.1 18.2 7H5.8z"/></svg>
      <div>Iscrizioni in negozio o via mail<b>sciclubdonboscoasti@gmail.com</b></div>
    </div>
  </div>
</div>
<script src="../comune.js"></script>
</body>
</html>
