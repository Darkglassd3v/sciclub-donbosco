<!doctype html>
<html lang="it" class="post">
<head>
<meta charset="utf-8">
<title>Evento · A Biglietto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=block">
<link rel="stylesheet" href="../comune.css">
<link rel="stylesheet" href="a.css">
<!-- Evento: il blu del club (per ora gite ed eventi solo in giallo e blu); la scena è di sera, con le lucine. -->
<style>
html { --cat: #084C8D; --scena: 300px; }
h1 { font-size: 100px; }
</style>
</head>
<body>
<div class="cv">
  <div class="neve" data-neve=".3"></div>
  <div class="biglietto">
    <div class="scena">
      <svg viewBox="0 0 1080 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="sera" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06396A"/><stop offset=".8" stop-color="#3E7CB8"/></linearGradient>
        </defs>
        <rect width="1080" height="600" fill="url(#sera)"/>
        <polygon fill="#2E5F92" points="0,400 150,290 290,350 460,230 600,330 760,220 900,310 1080,250 1080,600 0,600"/>
        <polygon fill="#C9D7E4" points="0,480 200,360 340,430 560,300 740,430 900,360 1080,450 1080,600 0,600"/>
        <polygon fill="#14304F" points="0,540 140,500 260,530 420,490 600,540 800,500 1080,545 1080,600 0,600"/>
        <polygon fill="#fff" points="0,585 1080,560 1080,600 0,600"/>
        <!-- Il filo delle lucine, da un lato all'altro. -->
        <path d="M380 330 Q620 430 1080 330" fill="none" stroke="#14202E" stroke-width="4"/>
        <g fill="#FCCF02">
          <circle cx="440" cy="355" r="13"/><circle cx="520" cy="374" r="13"/><circle cx="600" cy="382" r="13"/>
          <circle cx="680" cy="381" r="13"/><circle cx="760" cy="374" r="13"/><circle cx="840" cy="362" r="13"/>
          <circle cx="920" cy="350" r="13"/><circle cx="1000" cy="338" r="13"/>
        </g>
      </svg>
      <div class="logo-box"><img src="../../../logo/logo_sciclubdonbosco.svg" alt="Sci Club Don Bosco"></div>
      <div class="bollo"><div class="g">Sabato</div><div class="n">10/04</div></div>
    </div>
    <div class="taglio"><i></i></div>
    <div class="testo">
      <h1>Cena di fine stagione<small>con le premiazioni della gara sociale</small></h1>
      <dl class="fatti">
        <dt>Orario</dt><dd><span class="forte">ore 20:00</span></dd>
        <dt>Dove</dt><dd>Salone dell'oratorio Don Bosco, Asti</dd>
        <dt>Quota</dt><dd>soci € 30 · bambini € 15</dd>
        <dt>Iscrizioni</dt><dd>entro mercoledì 7 aprile</dd>
      </dl>
    </div>
    <div class="iscrizioni">
      <svg viewBox="0 0 24 24" fill="#084C8D" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3-8-5.3zM5.8 7 12 11.1 18.2 7H5.8z"/></svg>
      <div>Iscrizioni in negozio o via mail<b>sciclubdonboscoasti@gmail.com</b></div>
    </div>
  </div>
  <div class="luna" style="left:30px"></div><div class="luna" style="right:30px"></div>
</div>
<script src="../comune.js"></script>
