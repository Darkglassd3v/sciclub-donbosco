<!doctype html>
<html lang="it" class="post">
<head>
<meta charset="utf-8">
<title>A · Biglietto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=block">
<link rel="stylesheet" href="comune.css">
<style>
/* A · Biglietto. Evoluzione di Ritocco: il biglietto bianco sul colore della
 * categoria (il verde dei corsi), in 4:5 come Montagna. Al posto della foto
 * della meta, un paesaggio disegnato con la figura dell'esercizio. Story:
 * stesso biglietto; logo e bollo scendono sotto la fascia del profilo (250 px),
 * il biglietto finisce sopra quella della risposta (340 px). */
html { --k: 1; --m: 60px; --su: 0px; --scena: 330px; }
html.story { --k: 1.3; --su: 190px; --scena: 500px; }
.cv { background: var(--verde); }
.biglietto { position: absolute; left: var(--m); right: var(--m); top: var(--m); bottom: var(--m);
  background: #fff; border-radius: 40px; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 14px 40px rgba(0,0,0,.25); }
html.story .biglietto { bottom: 340px; }

.scena { position: relative; flex: 0 0 var(--scena); }
.scena .paesaggio { position: absolute; inset: 0; width: 100%; height: 100%; }
.scena .figura { position: absolute; left: 330px; bottom: 16px; height: calc(var(--scena) * .64); }
html.story .scena .figura { left: 330px; bottom: 26px; height: calc(var(--scena) * .5); }
.scena .logo-box { position: absolute; left: 0; top: var(--su); padding: 18px 26px; border-radius: 0 0 28px 0; }
html.story .scena .logo-box { border-top-right-radius: 28px; }
.scena .logo-box img { height: calc(100px * var(--k)); }
.bollo { position: absolute; right: 40px; top: calc(var(--su) + 36px); background: var(--verde); color: #fff;
  border-radius: calc(28px * var(--k)); text-align: center; padding: calc(14px * var(--k)) calc(26px * var(--k)) calc(10px * var(--k)); }
.bollo .g { font-size: calc(36px * var(--k)); font-weight: 700; }
.bollo .n { font-size: calc(100px * var(--k)); font-weight: 800; line-height: .95; letter-spacing: -.03em; padding-bottom: calc(8px * var(--k)); }

/* Il taglio del biglietto: il tratteggio, e due mezzelune del colore di fondo
 * sopra i bordi (stanno nella tela, non nel biglietto, che non deve sbordare). */
.taglio { position: relative; height: 0; flex: 0 0 auto; }
.taglio i { position: absolute; left: 40px; right: 40px; top: -2px; border-top: 4px dashed var(--filo); }
.luna { position: absolute; top: calc(var(--m) + var(--scena) - 30px); width: 60px; height: 60px; border-radius: 50%; background: var(--verde); }

.testo { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center;
  gap: calc(24px * var(--k)); padding: calc(24px * var(--k)) 56px calc(16px * var(--k)); }
h1 { font-size: calc(122px * var(--k)); font-weight: 800; letter-spacing: -.035em; line-height: .98; }
.fatti { display: grid; grid-template-columns: auto 1fr; column-gap: 30px; row-gap: calc(16px * var(--k)); align-items: baseline; }
.fatti dt { font-size: calc(36px * var(--k)); font-weight: 600; color: var(--testo-soft); }
.fatti dd { font-size: calc(50px * var(--k)); font-weight: 700; line-height: 1.12; }
.fatti .nota { font-weight: 600; color: var(--testo-soft); font-size: .8em; white-space: nowrap; }
.fatti .riga { display: block; margin-top: 4px; }
.fatti .nw { white-space: nowrap; }
/* Story: corpi fissi, non scalati, per stare nel biglietto senza scendere sotto i 44 px. */
html.story h1 { font-size: 134px; }
html.story .fatti dt { font-size: 44px; }
html.story .fatti dd { font-size: 56px; }

.iscrizioni { flex: none; margin: 0 40px; border-top: 4px dashed var(--filo);
  padding: calc(20px * var(--k)) 16px calc(26px * var(--k)); display: flex; gap: 22px; align-items: center; }
.iscrizioni svg { flex: none; width: calc(64px * var(--k)); height: calc(64px * var(--k)); }
.iscrizioni div { font-size: calc(36px * var(--k)); font-weight: 600; line-height: 1.2; }
.iscrizioni b { display: block; font-size: calc(40px * var(--k)); font-weight: 800; color: var(--verde); letter-spacing: -.02em; }

.firma { display: none; }
html.story .firma { display: block; position: absolute; left: 0; right: 0; top: 1640px; text-align: center;
  color: #fff; font-size: 46px; font-weight: 800; letter-spacing: .12em; }
</style>
</head>
<body>
<div class="cv">
  <div class="neve" data-neve></div>
  <div class="biglietto">
    <div class="scena">
      <!-- Paesaggio disegnato (come photo() di social-templates.js), largo: il
           post ne mostra la parte bassa, la story tutto. -->
      <svg class="paesaggio" viewBox="0 0 1080 600" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E7CB8"/><stop offset=".75" stop-color="#BFD7EC"/></linearGradient>
          <linearGradient id="neve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#C9D7E4"/></linearGradient>
        </defs>
        <rect width="1080" height="600" fill="url(#cielo)"/>
        <polygon fill="#8FA9C4" points="0,400 150,290 290,350 460,230 600,330 760,220 900,310 1080,250 1080,600 0,600"/>
        <polygon fill="url(#neve)" points="0,480 200,360 340,430 560,300 740,430 900,360 1080,450 1080,600 0,600"/>
        <polygon fill="#5E7890" opacity=".35" points="560,300 610,350 590,390 640,450 560,420 520,350"/>
        <polygon fill="#2E4A63" points="0,540 140,500 260,530 420,490 600,540 800,500 1080,545 1080,600 0,600"/>
        <polygon fill="#fff" points="0,585 1080,560 1080,600 0,600"/>
      </svg>
      <!-- La figura dell'esercizio: accosciata a braccia tese, la posizione dello sci, su un tappetino. -->
      <svg class="figura" viewBox="0 0 230 240" aria-hidden="true">
        <rect x="18" y="214" width="200" height="18" rx="9" fill="#FCCF02"/>
        <g stroke="#06396A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M120 70 L84 136"/>
          <path d="M114 82 L192 92"/>
          <path d="M84 136 L154 142 L140 206 L172 206"/>
        </g>
        <circle cx="134" cy="38" r="25" fill="#06396A"/>
      </svg>
      <div class="logo-box"><img src="../../logo/logo_sciclubdonbosco.svg" alt="Sci Club Don Bosco"></div>
      <div class="bollo"><div class="g">Mercoledì</div><div class="n">21/10</div></div>
    </div>
    <div class="taglio"><i></i></div>
    <div class="testo">
      <h1>Ginnastica presciistica</h1>
      <dl class="fatti">
        <dt>Orario</dt><dd>ore 19:30 <span class="nota">· lezioni di un'ora</span></dd>
        <dt>Dove</dt><dd>Palestra Way Assauto, Asti</dd>
        <dt>Quando</dt><dd>ogni mercoledì <span class="nw">fino al 13 gennaio</span> <span class="nota riga">escluso il periodo di Natale</span></dd>
        <dt>Per chi</dt><dd>soci tesserati e assicurati</dd>
      </dl>
    </div>
    <div class="iscrizioni">
      <svg viewBox="0 0 24 24" fill="#147A45" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3-8-5.3zM5.8 7 12 11.1 18.2 7H5.8z"/></svg>
      <div>Iscrizioni in negozio o via mail<b>sciclubdonboscoasti@gmail.com</b></div>
    </div>
  </div>
  <div class="luna" style="left:30px"></div><div class="luna" style="right:30px"></div>
  <div class="firma" data-decoro>SCI CLUB DON BOSCO</div>
</div>
<script src="comune.js"></script>
</body>
</html>
