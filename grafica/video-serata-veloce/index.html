<!doctype html>
<!-- Reel veloce dell'invito alla serata di presentazione (25/11/2026), per le inserzioni Instagram: 16 s.
     Apre come il video della stagione, col logo grande che cade al centro e rimbalza, ma resta fermo un
     secondo in più prima di girare e volare nell'angolo; da 3,5 s il montaggio 00-veloce.html taglia ogni
     0,9 s e a 9 s arriva il finale della serata (05-serata.html). assets e compositions sono collegamenti
     a ../video-stagione. -->
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06396a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .scena { position: absolute; inset: 0; }
      /* Stacco verso il finale: lampo bianco come la neve sull'obiettivo, poi il finale si schiarisce */
      #neve { position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(circle at 32% 44%, #ffffff 0%, #f1f5fa 45%, #d9e3ee 100%); }
      /* Logo blu tondo: apre il video al centro, grande, poi resta in alto a sinistra fino al finale, sotto la
       * fascia coperta da Instagram.
       * Il tempo sta sullo strato a tutto schermo: un <img> a tempo prende il formato pieno e si stira. */
      #logo-strato { position: absolute; inset: 0; pointer-events: none; }
      #logo-fisso { position: absolute; left: 64px; top: 270px; width: 210px; height: 210px;
        filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.4)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <div class="scena" id="f00-veloce" data-composition-id="f00-veloce" data-composition-src="compositions/frames/00-veloce.html"
        data-start="0" data-duration="9.6" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div class="scena" id="f05-serata" data-composition-id="f05-serata" data-composition-src="compositions/frames/05-serata.html"
        data-start="9" data-duration="7" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="neve"></div>
      <div id="logo-strato" class="clip" data-start="0" data-duration="9" data-track-index="1">
        <img id="logo-fisso" src="assets/logo/logo-ufficiale-blu-tondo.svg" alt="Sci Club Don Bosco Asti" />
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Apertura: il logo cade al centro grande (840 px, scala 4 sui 210 px dell'angolo) e rimbalza
      // schiacciandosi come una gomma. Dal centro dell'angolo (169, 375) al centro del fotogramma (540, 960):
      // x 371, y 585.
      const CENTRO = { x: 371, y: 585 };
      tl.fromTo("#logo-fisso", { x: CENTRO.x, y: CENTRO.y - 420, scaleX: 0.6, scaleY: 0.6, opacity: 0 }, {
        keyframes: [
          { y: CENTRO.y, scaleX: 3.2, scaleY: 4.6, opacity: 1, duration: 0.32, ease: "power2.in" },
          { scaleX: 4.8, scaleY: 3.2, duration: 0.12, ease: "power2.out" },
          { y: CENTRO.y - 110, scaleX: 3.7, scaleY: 4.4, duration: 0.22, ease: "power2.out" },
          { y: CENTRO.y, scaleX: 4.4, scaleY: 3.6, duration: 0.2, ease: "power2.in" },
          { scaleX: 4, scaleY: 4, duration: 0.24, ease: "elastic.out(1, 0.5)" },
        ],
      }, 0.05);
      // PAUSA: il logo resta fermo al centro un secondo in più che nel video della stagione (dove gira a 1 s),
      // poi gira sempre più veloce (tre giri), si rimpicciolisce e vola nell'angolo, dove si ferma prima
      // del primo taglio veloce a 3,5 s.
      const PAUSA = 1;
      tl.fromTo("#logo-fisso", { rotation: 0 }, { rotation: 1080, duration: 1.35, ease: "power3.inOut", immediateRender: false }, 1.0 + PAUSA);
      tl.to("#logo-fisso", { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.95, ease: "power3.inOut" }, 1.4 + PAUSA);
      // Finale: lampo bianco, poi il finale si schiarisce dal bianco e torna a fuoco
      const FINALE = 9;
      tl.fromTo("#neve", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, FINALE - 0.08);
      tl.to("#neve", { opacity: 0, duration: 0.55, ease: "power1.out" }, FINALE + 0.08);
      tl.fromTo("#f05-serata", { opacity: 0, filter: "blur(18px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, FINALE);
      // Il logo piccolo se ne va col lampo: il finale ha il suo
      tl.to("#logo-fisso", { opacity: 0, duration: 0.2, ease: "power2.in" }, FINALE - 0.25);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
