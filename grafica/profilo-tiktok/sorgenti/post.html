<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<title>Post del profilo TikTok</title>
<link rel="stylesheet" href="../../font/barlow/barlow.css">
<!--
  Il post da feed (1080×1350, Instagram e Facebook) che annuncia il profilo TikTok del club, copia del post del
  canale WhatsApp (../../canale-whatsapp/sorgenti/post.html) nello stile K · Piani: foto in alto, angolo giallo col
  logo blu, cuneo giallo, Barlow 800. Il telefono mostra il profilo con i fotogrammi dei nostri video; a sinistra
  i passi per trovarlo cercando il nome del club. Il nome utente non compare: ha un refuso
  correggibile solo dal 15/12/2026, e il link va comunque nel testo del post.
  Foto: pista a La Thuile di DimiTalen, Wikimedia Commons, CC0. Logo TikTok: Simple Icons.
-->
<style>
  html, body { margin: 0; background: #14202E; }
  .cv { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff;
        background: #14202E; font-family: Barlow, sans-serif; letter-spacing: -.01em; }
  .cv * { box-sizing: border-box; margin: 0; }
  .foto { position: absolute; left: 0; right: 0; top: 0; height: 718px;
          background: url(../../proposte-post-social/sorgenti/foto/calendario-montagna.jpg) center 40% / cover; }
  .scuro { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,32,46,.2) 0, rgba(20,32,46,.62) 330px, rgba(20,32,46,.95) 640px, #14202E 718px); }
  /* L'angolo giallo come nei post: la foto in grigi col giallo sopra, sotto il logo blu ufficiale. */
  .angolo { position: absolute; inset: 0; opacity: .7; clip-path: polygon(0 0, 520px 0, 0 520px); }
  .angolo .grigi { position: absolute; left: 0; right: 0; top: 0; height: 718px; filter: grayscale(1) brightness(1.4) contrast(1.2);
                   background: url(../../proposte-post-social/sorgenti/foto/calendario-montagna.jpg) center 40% / cover; }
  .angolo .tinta { position: absolute; inset: 0; background: #FCCF02; mix-blend-mode: multiply; }
  /* Il cuneo giallo da bordo a bordo nell'angolo in basso a destra, dietro il telefono. */
  .cuneo { position: absolute; inset: 0; background: #FCCF02; opacity: .9; clip-path: polygon(100% 760px, 100% 1350px, 490px 1350px); }
  .logo { position: absolute; left: 50px; top: 46px; width: 196px; height: 196px; border-radius: 50%; box-shadow: 0 8px 26px rgba(0,0,0,.45); }
  .testo { position: absolute; left: 60px; right: 60px; top: 270px; text-shadow: 0 2px 14px rgba(20,32,46,.6); }
  .gancio { font-size: 54px; font-weight: 800; font-style: italic; color: #FCCF02; }
  .tit { font-size: 104px; font-weight: 800; line-height: .92; letter-spacing: -.035em; margin-top: 8px; }
  .tit .tt { display: inline-flex; align-items: center; gap: 18px; }
  /* Il logo di TikTok bianco con le due ombre ciano e rosa, come quello dell'app */
  .tit .tt svg { width: 84px; height: 84px; fill: #fff; filter: drop-shadow(-4px -3px 0 #25F4EE) drop-shadow(4px 3px 0 #FE2C55); }

  /* I passi, a sinistra del telefono */
  .passi { position: absolute; left: 60px; top: 700px; width: 470px; display: flex; flex-direction: column; gap: 26px; }
  .passi .seg { align-self: flex-start; background: #FCCF02; color: #084C8D; font-size: 62px; font-weight: 800; line-height: 1;
                padding: 18px 30px 16px; clip-path: polygon(30px 0, 100% 0, 100% 100%, 0 100%, 0 30px); }
  .passi ol { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 20px; }
  .passi li { display: flex; gap: 18px; align-items: flex-start; font-size: 38px; font-weight: 600; line-height: 1.15; }
  .passi li i { flex: none; width: 54px; height: 54px; background: #084C8D; color: #FCCF02; font-style: normal; font-weight: 800;
                font-size: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; margin-top: -4px; }
  .passi li b { font-weight: 800; color: #FCCF02; white-space: nowrap; }
  /* In fondo a sinistra il perché, sotto i passi */
  .perche { position: absolute; left: 60px; top: 1190px; width: 460px; font-size: 40px; font-weight: 700; line-height: 1.15; color: #DCE4EC; }
  .perche b { color: #fff; background: #084C8D; padding: 0 .18em; border-radius: 8px; }

  /* Il telefono, appena inclinato, che esce dal bordo in basso: il profilo TikTok del club, schermo scuro */
  .tel { position: absolute; left: 556px; top: 640px; width: 470px; height: 900px; border-radius: 64px; background: #0B1118;
         padding: 18px; transform: rotate(4deg); box-shadow: 0 30px 70px rgba(0,0,0,.55), inset 0 0 0 3px #2B3947; }
  .schermo { width: 100%; height: 100%; border-radius: 48px; overflow: hidden; background: #121212; color: #fff; letter-spacing: 0; }
  .testa { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 22px 18px; }
  .testa img { width: 108px; height: 108px; border-radius: 50%; box-shadow: 0 0 0 4px #FCCF02; }
  .testa b { font-size: 30px; font-weight: 800; }
  .segui { margin-top: 4px; background: #FE2C55; color: #fff; font-size: 26px; font-weight: 700; padding: 10px 64px; border-radius: 8px; }
  .schede { display: flex; justify-content: center; gap: 48px; font-size: 22px; font-weight: 700; color: #8A8B91; border-bottom: 1px solid #2A2A2E; padding-bottom: 10px; }
  .schede span:first-child { color: #fff; box-shadow: 0 13px 0 -10px #fff; }
  .griglia { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding-top: 3px; }
  .griglia img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; display: block; }
</style></head>
<body>
<div class="cv">
  <div class="foto"></div><div class="scuro"></div><div class="angolo"><div class="grigi"></div><div class="tinta"></div></div><div class="cuneo"></div>
  <img class="logo" src="../../logo/logo-ufficiale-blu-tondo.svg" alt="Sci Club Don Bosco Asti">
  <div class="testo">
    <div class="gancio">Ci trovi anche qui!</div>
    <div class="tit">Il nostro profilo <span class="tt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>TikTok</span></div>
  </div>
  <div class="passi">
    <div class="seg">Seguici!</div>
    <ol>
      <li><i>1</i><span>Apri TikTok › <b>Cerca</b></span></li>
      <li><i>2</i><span>Scrivi <b>Sci Club Don Bosco Asti</b></span></li>
      <li><i>3</i><span>Premi <b>Segui</b> sul nostro profilo</span></li>
    </ol>
  </div>
  <p class="perche">Gite, piste e serate in video: <b>guardale qui</b>.</p>
  <div class="tel"><div class="schermo">
    <div class="testa"><img src="../../logo/logo-ufficiale-blu-tondo.svg" alt=""><b>Sci Club Don Bosco Asti</b><span class="segui">Segui</span></div>
    <div class="schede"><span>Video</span><span>Preferiti</span></div>
    <div class="griglia">
      <img src="fotogrammi/video-1.jpg" alt=""><img src="fotogrammi/video-2.jpg" alt=""><img src="fotogrammi/video-3.jpg" alt="">
      <img src="fotogrammi/video-4.jpg" alt=""><img src="fotogrammi/video-5.jpg" alt=""><img src="fotogrammi/video-6.jpg" alt="">
    </div>
  </div></div>
</div>
</body></html>
