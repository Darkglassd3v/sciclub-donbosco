<!doctype html>
<!-- Reel del Dream Weekend al Sestriere, 20 s, con il linguaggio del video della stagione (../video-stagione/). -->
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06396a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .scena { position: absolute; inset: 0; }
      /* Cambio scena: la scena nuova entra dall'alto dietro un taglio a 45°, come nel video della stagione.
       * Il verde è il colore dei weekend nei post. */
      .banda { position: absolute; left: 0; top: 0; width: 1080px; height: 1160px; pointer-events: none; }
      .banda i { position: absolute; inset: 0; }
      .banda .pieno { clip-path: polygon(0 1080px, 100% 0, 100% 52px, 0 1132px); }
      .banda .filo { clip-path: polygon(0 1140px, 100% 60px, 100% 74px, 0 1154px); }
      .banda.gialla .pieno, .banda.verde .filo { background: #FCCF02; }
      .banda.gialla .filo { background: #084C8D; }
      .banda.verde .pieno { background: #147A45; }
      /* La nuvola di neve dello spruzzo copre l'obiettivo: un lampo bianco la completa e la scena dei contatti si
       * schiarisce da sotto. */
      #neve { position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(circle at 32% 44%, #ffffff 0%, #f1f5fa 45%, #d9e3ee 100%); }
      /* Il logo tondo apre il video al centro e poi resta in alto a sinistra, sotto la fascia coperta da Instagram.
       * L'anello bianco lo stacca dal fondo blu della scena dei contatti. */
      #logo-strato { position: absolute; inset: 0; pointer-events: none; }
      #logo-fisso { position: absolute; left: 64px; top: 270px; width: 210px; height: 210px; border-radius: 50%;
        box-shadow: 0 0 0 6px #fff, 0 8px 22px rgba(0, 0, 0, 0.4); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div class="scena" id="s1-gancio" data-composition-id="s1-gancio" data-composition-src="compositions/01-gancio.html"
        data-start="0" data-duration="4" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div class="scena" id="s2-sestriere" data-composition-id="s2-sestriere" data-composition-src="compositions/02-sestriere.html"
        data-start="3.2" data-duration="4.8" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div class="scena" id="s3-cosa" data-composition-id="s3-cosa" data-composition-src="compositions/03-cosa.html"
        data-start="7.2" data-duration="4.8" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div class="scena" id="s4-iscrizioni" data-composition-id="s4-iscrizioni" data-composition-src="compositions/04-iscrizioni.html"
        data-start="11.3" data-duration="5.8" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div class="scena" id="f05-seguici" data-composition-id="f05-seguici" data-composition-src="compositions/05-seguici.html"
        data-start="16.3" data-duration="3.7" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div class="banda gialla" id="banda-1"><i class="pieno"></i><i class="filo"></i></div>
      <div class="banda verde" id="banda-2"><i class="pieno"></i><i class="filo"></i></div>
      <div class="banda gialla" id="banda-3"><i class="pieno"></i><i class="filo"></i></div>
      <div id="neve"></div>
      <div id="logo-strato" class="clip" data-start="0" data-duration="17" data-track-index="1">
        <img id="logo-fisso" src="assets/logo/logo-ufficiale-blu-tondo.svg" alt="Sci Club Don Bosco Asti" />
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Apertura: il logo cade al centro grande (scala 4 sui 210 px dell'angolo) e rimbalza; è più breve che nel
      // video della stagione perché in un Reel il gancio deve arrivare entro il primo secondo.
      // Dal centro dell'angolo (169, 375) al centro del fotogramma (540, 960): x 371, y 585.
      const CENTER = { x: 371, y: 585 };
      tl.fromTo("#logo-fisso", { x: CENTER.x, y: CENTER.y - 420, scaleX: 0.6, scaleY: 0.6, opacity: 0 }, {
        keyframes: [
          { y: CENTER.y, scaleX: 3.2, scaleY: 4.6, opacity: 1, duration: 0.26, ease: "power2.in" },
          { scaleX: 4.8, scaleY: 3.2, duration: 0.1, ease: "power2.out" },
          { y: CENTER.y - 80, scaleX: 3.8, scaleY: 4.3, duration: 0.14, ease: "power2.out" },
          { y: CENTER.y, scaleX: 4, scaleY: 4, duration: 0.14, ease: "power2.in" },
        ],
      }, 0);
      // Gira sempre più veloce, si rimpicciolisce e vola nell'angolo, dove frena fino a fermarsi.
      tl.fromTo("#logo-fisso", { rotation: 0 }, { rotation: 720, duration: 1.0, ease: "power3.inOut", immediateRender: false }, 0.65);
      tl.to("#logo-fisso", { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.8, ease: "power3.inOut" }, 0.85);
      // Ogni scena nuova si scopre dall'alto lungo una linea a 45°, che scende con la sua banda.
      const WIPES = [["#s2-sestriere", 3.2], ["#s3-cosa", 7.2], ["#f05-seguici", 16.3]];
      const WIPE = 0.8;
      const cut = (a) => `polygon(0px 0px, 1080px 0px, 1080px ${a}px, 0px ${a + 1080}px)`;
      WIPES.forEach(([scene, t], i) => {
        tl.fromTo(scene, { clipPath: cut(-1160) }, { clipPath: cut(1920), duration: WIPE, ease: "power2.inOut" }, t);
        tl.fromTo(`#banda-${i + 1}`, { y: -1160 }, { y: 1920, duration: WIPE, ease: "power2.inOut" }, t);
      });
      // La scena dei contatti entra dalla neve dello spruzzo, non con la tendina.
      const CONTACTS = 11.3;
      tl.fromTo("#neve", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, CONTACTS - 0.08);
      tl.to("#neve", { opacity: 0, duration: 0.55, ease: "power1.out" }, CONTACTS + 0.08);
      tl.fromTo("#s4-iscrizioni", { opacity: 0, filter: "blur(18px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, CONTACTS);
      // Il logo piccolo lascia il posto a quello grande del finale, mentre la tendina lo scopre.
      tl.to("#logo-fisso", { opacity: 0, duration: 0.2, ease: "power2.in" }, 16.35);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
