<!doctype html>
<html lang="it">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("assets/fonts/barlow-condensed-800.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Barlow Condensed", sans-serif; background: #06396a; }
        #s1-cam { position: absolute; inset: 0; transform-origin: 50% 60%; }
        #s1-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #s1-velo { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 28, 52, 0) 30%, rgba(4, 28, 52, 0.6) 58%, rgba(4, 28, 52, 0.85) 100%); }
        #s1-testo { position: absolute; left: 64px; right: 140px; bottom: 420px; font-weight: 800; text-transform: uppercase; }
        .s1-riga { display: block; font-size: 220px; line-height: 0.88; letter-spacing: 0.005em; text-shadow: 0 6px 28px rgba(0, 0, 0, 0.5); }
        #s1-b { color: #FCCF02; }
        #s1-a, #s1-b { transform-origin: 0% 100%; }
        #s1-posti { display: inline-block; margin-top: 26px; padding: 10px 26px 12px; background: #FCCF02; color: #084C8D; font-size: 84px; line-height: 1; }
      </style>
      <div id="root" data-composition-id="s1-gancio" data-width="1080" data-height="1920">
        <div id="s1-cam">
          <video id="s1-v0" class="clip" src="assets/clip/verticali/sciatore.mp4" muted playsinline data-start="0" data-duration="4" data-media-start="8" data-track-index="0"></video>
        </div>
        <div id="s1-velo"></div>
        <div id="s1-testo">
          <span class="s1-riga" id="s1-a">Dream</span>
          <span class="s1-riga" id="s1-b">Weekend</span>
          <span id="s1-posti">Posti limitati</span>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s1-cam", { scale: 1.02 }, { scale: 1.1, duration: 4, ease: "none" }, 0);
        // Il titolo arriva quando il logo ha lasciato il centro, altrimenti gli passerebbe sopra.
        tl.fromTo("#s1-a", { scale: 1.5, filter: "blur(16px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power4.out" }, 1.2);
        tl.fromTo("#s1-b", { y: 90, rotation: 4, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" }, 1.45);
        tl.fromTo("#s1-posti", { x: -360, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 1.85);
        window.__timelines["s1-gancio"] = tl;
      </script>
    </template>
  </body>
</html>
