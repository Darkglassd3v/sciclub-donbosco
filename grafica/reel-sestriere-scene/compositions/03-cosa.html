<!doctype html>
<html lang="it">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("assets/fonts/barlow-condensed-800.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 600; src: url("assets/fonts/barlow-600.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Barlow Condensed", sans-serif; background: #06396a; }
        #s3-cam { position: absolute; inset: 0; transform-origin: 50% 60%; }
        #s3-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #s3-zoom { position: absolute; inset: 0; transform-origin: 32% 42%; }
        #s3-velo { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 28, 52, 0) 28%, rgba(4, 28, 52, 0.7) 50%, rgba(4, 28, 52, 0.88) 100%); }
        #s3-elenco { position: absolute; left: 64px; right: 140px; bottom: 420px; display: flex; flex-direction: column; gap: 30px; }
        .s3-voce { position: relative; padding-left: 52px; }
        .s3-punto { position: absolute; left: 0; top: 34px; width: 30px; height: 30px; border-radius: 50%; background: #FCCF02; }
        .s3-forte { display: block; font-size: 104px; font-weight: 800; line-height: 1; text-transform: uppercase; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
        .s3-piano { display: block; font: 600 56px/1.15 Barlow, sans-serif; text-shadow: 0 3px 14px rgba(0, 0, 0, 0.6); }
      </style>
      <div id="root" data-composition-id="s3-cosa" data-width="1080" data-height="1920">
        <div id="s3-cam">
          <video id="s3-v0" class="clip" src="assets/clip/verticali/pista.mp4" muted playsinline data-start="0" data-duration="2.6" data-media-start="6.5" data-track-index="0"></video>
          <!-- Lo spruzzo arriva da vicino e la nuvola di neve, al secondo 2,12 della clip, fa da stacco verso i contatti. -->
          <div id="s3-zoom">
            <video id="s3-v1" class="clip" src="assets/clip/verticali/spruzzo.mp4" muted playsinline data-start="2.6" data-duration="2.2" data-media-start="0.62" data-track-index="0"></video>
          </div>
        </div>
        <div id="s3-velo"></div>
        <div id="s3-elenco">
          <div class="s3-voce" id="s3-a"><i class="s3-punto"></i><span class="s3-forte">Mezza pensione</span><span class="s3-piano">in camera doppia</span></div>
          <div class="s3-voce" id="s3-b"><i class="s3-punto"></i><span class="s3-forte">Skipass Vialattea</span><span class="s3-piano">con o senza</span></div>
          <div class="s3-voce" id="s3-c"><i class="s3-punto"></i><span class="s3-forte">Prezzi ridotti</span><span class="s3-piano">per ragazzi e bambini</span></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const SPRAY = 2.6;
        tl.fromTo("#s3-cam", { scale: 1 }, { scale: 1.07, duration: 4.8, ease: "none" }, 0);
        tl.fromTo("#s3-zoom", { scale: 1.45 }, { scale: 1.7, duration: 4.8 - SPRAY, ease: "power1.in" }, SPRAY);
        ["#s3-a", "#s3-b", "#s3-c"].forEach((item, i) => {
          tl.fromTo(item, { x: -360, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.7 + i * 1.0);
        });
        // La neve dello spruzzo porta via l'elenco, così non traspare mentre entra la scena dei contatti.
        tl.to("#s3-elenco", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, SPRAY + 1.4);
        window.__timelines["s3-cosa"] = tl;
      </script>
    </template>
  </body>
</html>
