<!doctype html>
<html lang="it">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("assets/fonts/barlow-condensed-800.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 600; src: url("assets/fonts/barlow-600.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/barlow-700.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Barlow Condensed", sans-serif; background: #06396a; }
        #s4-cam { position: absolute; inset: 0; }
        #s4-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #s4-velo { position: absolute; inset: 0; background: rgba(8, 76, 141, 0.9); }
        #s4-col { position: absolute; left: 64px; right: 120px; top: 530px; }
        #s4-titolo { font-size: 142px; font-weight: 800; line-height: 1; color: #FCCF02; text-transform: uppercase; white-space: nowrap; }
        #s4-sotto { margin-top: 18px; font: 600 54px/1.2 Barlow, sans-serif; text-wrap: balance; }
        #s4-righe { margin-top: 36px; display: flex; flex-direction: column; gap: 18px; }
        .s4-riga { display: flex; align-items: center; gap: 24px; font: 600 62px/1 Barlow, sans-serif; }
        .s4-nome { width: 280px; flex: none; }
        .s4-riga b { font: 800 88px/1 "Barlow Condensed", sans-serif; color: #FCCF02; letter-spacing: 0.01em; white-space: nowrap; }
        #s4-mail { margin-top: 36px; font: 700 54px/1 Barlow, sans-serif; white-space: nowrap; }
      </style>
      <div id="root" data-composition-id="s4-iscrizioni" data-width="1080" data-height="1920">
        <div id="s4-cam">
          <video id="s4-v0" class="clip" src="assets/clip/verticali/bosco.mp4" muted playsinline data-start="0" data-duration="5.8" data-media-start="3.5" data-track-index="0"></video>
        </div>
        <div id="s4-velo"></div>
        <div id="s4-col">
          <div id="s4-titolo">Posti limitati</div>
          <div id="s4-sotto">Iscrizioni in negozio, via mail o al telefono</div>
          <div id="s4-righe">
            <div class="s4-riga"><span class="s4-nome">Cesare</span><b>348 5171707</b></div>
            <div class="s4-riga"><span class="s4-nome">Beppe</span><b>339 3291015</b></div>
            <div class="s4-riga"><span class="s4-nome">Domenico</span><b>389 5794663</b></div>
          </div>
          <div id="s4-mail">sciclubdonboscoasti@gmail.com</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const ENTER = 0.45;
        tl.fromTo("#s4-cam", { scale: 1.08 }, { scale: 1, duration: 5.8, ease: "none" }, 0);
        tl.fromTo("#s4-titolo", { scale: 1.4, filter: "blur(14px)", opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" }, ENTER);
        tl.fromTo("#s4-sotto", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, ENTER + 0.35);
        gsap.utils.toArray(".s4-riga").forEach((row, i) => {
          tl.fromTo(row, { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, ENTER + 0.7 + i * 0.25);
        });
        tl.fromTo("#s4-mail", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, ENTER + 1.5);
        window.__timelines["s4-iscrizioni"] = tl;
      </script>
    </template>
  </body>
</html>
