<!doctype html>
<!-- Versione da 16 s, cambi più frequenti (la versione da 19 s è stata tolta il 13/11/2026: si usa questa). -->
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("assets/fonts/barlow-condensed-800.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 600; src: url("assets/fonts/barlow-600.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/barlow-700.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06396a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .scena { position: absolute; inset: 0; }
      /* Cambio scena: la scena nuova entra dall'alto dietro un taglio a 45° (come la tessera dei post K),
       * con un bordo sottile, una volta giallo con il filo blu e una volta blu con il filo giallo. */
      .banda { position: absolute; left: 0; top: 0; width: 1080px; height: 1160px; pointer-events: none; }
      .banda i { position: absolute; inset: 0; }
      .banda .pieno { clip-path: polygon(0 1080px, 100% 0, 100% 52px, 0 1132px); }
      .banda .filo { clip-path: polygon(0 1140px, 100% 60px, 100% 74px, 0 1154px); }
      .banda.gialla .pieno, .banda.blu .filo { background: #FCCF02; }
      .banda.blu .pieno, .banda.gialla .filo { background: #084C8D; }
      /* Stacco verso il finale: la nuvola di neve dello spruzzo copre l'obiettivo, un lampo bianco la
       * completa e il finale si schiarisce da sotto, come la neve che scivola via dalla lente. */
      #neve { position: absolute; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(circle at 32% 44%, #ffffff 0%, #f1f5fa 45%, #d9e3ee 100%); }
      /* Logo blu tondo: apre il video al centro, grande, poi resta in alto a sinistra fino al finale, sotto la
       * fascia coperta da Instagram.
       * Il tempo sta sullo strato a tutto schermo: un <img> a tempo prende il formato pieno e si stira. */
      #logo-strato { position: absolute; inset: 0; pointer-events: none; }
      #logo-fisso { position: absolute; left: 64px; top: 270px; width: 210px; height: 210px;
        filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.4)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <div class="scena" id="f01-intro" data-composition-id="f01-intro" data-composition-src="compositions/frames/01-intro.html"
        data-start="0" data-duration="3.3" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div class="scena" id="f02-pista" data-composition-id="f02-pista" data-composition-src="compositions/frames/02-pista.html"
        data-start="2.5" data-duration="3.8" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div class="scena" id="f03-gite" data-composition-id="f03-gite" data-composition-src="compositions/frames/03-gite.html"
        data-start="5.5" data-duration="4.0" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div class="scena" id="f05-seguici" data-composition-id="f05-seguici" data-composition-src="compositions/frames/05-seguici.html"
        data-start="9" data-duration="7" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div class="banda gialla" id="banda-1"><i class="pieno"></i><i class="filo"></i></div>
      <div class="banda blu" id="banda-2"><i class="pieno"></i><i class="filo"></i></div>
      <div id="neve"></div>
      <div id="logo-strato" class="clip" data-start="0" data-duration="9.8" data-track-index="1">
        <img id="logo-fisso" src="assets/logo/logo-ufficiale-blu-tondo.svg" alt="Sci Club Don Bosco Asti" />
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Apertura: il logo cade al centro grande (840 px, scala 4 sui 210 px dell'angolo) e rimbalza
      // schiacciandosi come una gomma.
      // Dal centro dell'angolo (169, 375) al centro del fotogramma (540, 960): x 371, y 585.
      const CENTRO = { x: 371, y: 585 };
      tl.fromTo("#logo-fisso", { x: CENTRO.x, y: CENTRO.y - 420, scaleX: 0.6, scaleY: 0.6, opacity: 0 }, {
        keyframes: [
          { y: CENTRO.y, scaleX: 3.2, scaleY: 4.6, opacity: 1, duration: 0.32, ease: "power2.in" },
          { scaleX: 4.8, scaleY: 3.2, duration: 0.12, ease: "power2.out" },
          { y: CENTRO.y - 110, scaleX: 3.7, scaleY: 4.4, duration: 0.22, ease: "power2.out" },
          { y: CENTRO.y, scaleX: 4.4, scaleY: 3.6, duration: 0.2, ease: "power2.in" },
          { scaleX: 4, scaleY: 4, duration: 0.24, ease: "elastic.out(1, 0.5)" },
        ],
      }, 0.05);
      // Poi gira sempre più veloce (tre giri), intanto si rimpicciolisce e vola nell'angolo, dove
      // rallenta fino a fermarsi: la rotazione accelera e frena, il volo parte un po' dopo e
      // finisce insieme a lei.
      tl.fromTo("#logo-fisso", { rotation: 0 }, { rotation: 1080, duration: 1.35, ease: "power3.inOut", immediateRender: false }, 1.0);
      tl.to("#logo-fisso", { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.95, ease: "power3.inOut" }, 1.4);
      // Ogni scena nuova si scopre dall'alto lungo una linea a 45°, che scende con la sua banda
      const CAMBI = [["#f02-pista", 2.5], ["#f03-gite", 5.5]];
      const TENDINA = 0.8;
      const taglio = (a) => `polygon(0px 0px, 1080px 0px, 1080px ${a}px, 0px ${a + 1080}px)`;
      CAMBI.forEach(([scena, t], i) => {
        tl.fromTo(scena, { clipPath: taglio(-1160) }, { clipPath: taglio(1920), duration: TENDINA, ease: "power2.inOut" }, t);
        tl.fromTo(`#banda-${i + 1}`, { y: -1160 }, { y: 1920, duration: TENDINA, ease: "power2.inOut" }, t);
      });
      // Il finale entra dalla neve dello spruzzo, non con la tendina: lampo bianco, poi il finale si
      // schiarisce dal bianco e torna a fuoco.
      const FINALE = 9;
      tl.fromTo("#neve", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, FINALE - 0.08);
      tl.to("#neve", { opacity: 0, duration: 0.55, ease: "power1.out" }, FINALE + 0.08);
      tl.fromTo("#f05-seguici", { opacity: 0, filter: "blur(18px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, FINALE);
      // Il logo piccolo se ne va quando la neve copre l'obiettivo: il finale ha il suo
      tl.to("#logo-fisso", { opacity: 0, duration: 0.2, ease: "power2.in" }, FINALE - 0.25);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
