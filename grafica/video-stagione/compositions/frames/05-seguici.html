      <script>
        const tl = gsap.timeline({ paused: true });
        const DUR = 5;
        // ENTRA: logo, mano e testi arrivano quando la tendina della scena è quasi finita
        const ENTRA = 0.7;
        const TOCCO = ENTRA + 1.1;
        tl.fromTo("#f05-seguici-cam", { scale: 1.08 }, { scale: 1, duration: DUR, ease: "none" }, 0);
        tl.fromTo("#f05-seguici-logo", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, ENTRA);
        // La mano arriva dal basso a destra e tocca il logo

        tl.to("#f05-seguici-mano", { scale: 0.86, duration: 0.12, ease: "power2.in", yoyo: true, repeat: 1 }, TOCCO);
        // Il logo si abbassa come un pulsante premuto e torna su con un piccolo rimbalzo
        tl.to("#f05-seguici-logo", { scale: 0.86, duration: 0.12, ease: "power1.in" }, TOCCO);
        tl.to("#f05-seguici-logo", { scale: 1, duration: 0.55, ease: "back.out(2.4)" }, TOCCO + 0.12);
        tl.fromTo(["#f05-cerchio-1", "#f05-cerchio-2"], { scale: 1, opacity: 0.95 }, { scale: 1.7, opacity: 0, duration: 0.75, ease: "power2.out", stagger: 0.14 }, TOCCO + 0.12);
