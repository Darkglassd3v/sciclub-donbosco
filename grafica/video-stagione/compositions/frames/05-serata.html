<!doctype html>
<html lang="it">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("assets/fonts/barlow-condensed-800.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 600; src: url("assets/fonts/barlow-600.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/barlow-700.woff2") format("woff2"); }
        /* Finale del video della serata di presentazione (25/11/2026), copia di 05-seguici.html: stesso
         * fondo blu sul bosco e stesso logo con l'anello, ma al posto di «Seguici» l'invito con data, ora e
         * luogo nei riquadri gialli dei post K. Testi fra 270 e 1580 px, fuori dalle zone coperte da Instagram. */
        #root { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Barlow Condensed", sans-serif; background: #06396a; }
        #f05-serata-cam { position: absolute; inset: 0; }
        #f05-serata-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #f05-serata-velo { position: absolute; inset: 0; background: rgba(8, 76, 141, 0.88); }
        #f05-serata-luce { position: absolute; left: 140px; top: 40px; width: 800px; height: 800px; border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0.12) 38%, rgba(255, 255, 255, 0) 68%); }
        #f05-serata-col { position: absolute; left: 64px; right: 64px; top: 270px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        #f05-serata-logo { width: 300px; height: 300px; display: block; border-radius: 50%;
          box-shadow: 0 0 0 12px #fff, 0 0 0 18px #FCCF02, 0 16px 40px rgba(0, 0, 0, 0.4); }
        #f05-serata-titolo { margin-top: 44px; font-size: 140px; font-weight: 800; line-height: 0.9; color: #FCCF02; text-transform: uppercase; white-space: nowrap; }
        #f05-serata-sotto { margin-top: 16px; font: 700 54px/1.15 Barlow, sans-serif; }
        /* Data e ora nel riquadro giallo con l'angolo tagliato, come la tessera dei post K */
        #f05-serata-quando { margin-top: 54px; padding: 18px 40px 14px; background: #FCCF02; color: #084C8D;
          clip-path: polygon(26px 0, 100% 0, 100% 100%, 0 100%, 0 26px); font-size: 92px; font-weight: 800; line-height: 1; text-transform: uppercase; white-space: nowrap; }
        #f05-serata-ora { display: block; margin-top: 6px; font-size: 76px; }
        #f05-serata-dove { margin-top: 46px; display: flex; align-items: flex-start; gap: 18px; text-align: left; }
        #f05-serata-dove svg { width: 58px; height: 58px; flex: none; margin-top: 4px; }
        #f05-serata-luogo { font: 700 58px/1.1 Barlow, sans-serif; }
        #f05-serata-indirizzo { display: block; margin-top: 8px; font: 600 46px/1.1 Barlow, sans-serif; }
        #f05-serata-extra { margin-top: 40px; font: 700 50px/1.1 Barlow, sans-serif; color: #FCCF02; }
      </style>
      <div id="root" data-composition-id="f05-serata" data-width="1080" data-height="1920">
        <div id="f05-serata-cam">
          <video id="f05-serata-v0" class="clip" src="assets/clip/verticali/bosco.mp4" muted playsinline data-start="0" data-duration="8" data-media-start="3.5" data-track-index="0"></video>
        </div>
        <div id="f05-serata-velo"></div>
        <div id="f05-serata-luce"></div>
        <div id="f05-serata-col">
          <img id="f05-serata-logo" src="assets/logo/logo-ufficiale-blu-tondo.svg" alt="Sci Club Don Bosco Asti" />
          <div id="f05-serata-titolo">Ti aspettiamo</div>
          <div id="f05-serata-sotto">Presentazione della stagione 2026/27</div>
          <div id="f05-serata-quando">Mercoledì 25 novembre<span id="f05-serata-ora">ore 21</span></div>
          <div id="f05-serata-dove">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FCCF02" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z" /></svg>
            <div id="f05-serata-luogo">Circolo Way Assauto<span id="f05-serata-indirizzo">corso Pietro Chiesa 20, Asti</span></div>
          </div>
          <div id="f05-serata-extra">Buffet e brindisi finale</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const DUR = 8;
        // ENTRA: il logo arriva quando la neve dello stacco si è quasi diradata, poi i testi uno dopo l'altro
        const ENTRA = 0.45;
        tl.fromTo("#f05-serata-cam", { scale: 1.08 }, { scale: 1, duration: DUR, ease: "none" }, 0);
        tl.fromTo("#f05-serata-logo", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, ENTRA);
        tl.fromTo("#f05-serata-titolo", { scale: 1.5, filter: "blur(14px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.55, ease: "power4.out" }, ENTRA + 0.5);
        tl.fromTo("#f05-serata-sotto", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, ENTRA + 0.9);
        // La data entra da sinistra come la tessera dei post e fa un piccolo scatto, per farsi notare
        tl.fromTo("#f05-serata-quando", { x: -140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, ENTRA + 1.3);
        tl.to("#f05-serata-quando", { scale: 1.06, duration: 0.18, ease: "power1.out", yoyo: true, repeat: 1 }, ENTRA + 1.9);
        tl.fromTo("#f05-serata-dove", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, ENTRA + 2.2);
        tl.fromTo("#f05-serata-extra", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, ENTRA + 2.6);
        window.__timelines["f05-serata"] = tl;
      </script>
    </template>
  </body>
</html>
