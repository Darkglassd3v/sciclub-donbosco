<!doctype html>
<html lang="it">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("assets/fonts/barlow-condensed-800.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 600; src: url("assets/fonts/barlow-600.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/barlow-700.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Barlow Condensed", sans-serif; background: #06396a; }
        #f04-attivita-cam { position: absolute; inset: 0; transform-origin: 50% 60%; }
        #f04-attivita-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #f04-attivita-velo { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 28, 52, 0) 32%, rgba(4, 28, 52, 0.55) 62%, rgba(4, 28, 52, 0.78) 100%); }
        .f04-attivita-titolo { position: absolute; left: 64px; right: 64px; bottom: 400px; font-weight: 800; text-transform: uppercase;
          line-height: 0.9; letter-spacing: 0.005em; text-shadow: 0 6px 28px rgba(0, 0, 0, 0.5); }
        .f04-attivita-titolo b { display: block; font-weight: 800; }
        .giallo { color: #FCCF02; }
        .f04-attivita-titolo { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; text-shadow: none; }
        .f04-attivita-titolo i { display: block; font-style: normal; font-size: 96px; line-height: 1; padding: 14px 30px 8px; white-space: nowrap;
          background: #084C8D; box-shadow: 12px 12px 0 #FCCF02; }
        .f04-rientro { margin-left: 70px; }

      </style>
      <div id="root" data-composition-id="f04-attivita" data-width="1080" data-height="1920">
        <div id="f04-attivita-cam">
          <video id="f04-attivita-v0" class="clip" src="assets/clip/verticali/scarpone.mp4" muted playsinline data-start="0" data-duration="1.9" data-media-start="1.6" data-track-index="0"></video>
          <video id="f04-attivita-v1" class="clip" src="assets/clip/verticali/attrezzatura.mp4" muted playsinline data-start="1.9" data-duration="1.9" data-media-start="3" data-track-index="0"></video>
        </div>
        <div id="f04-attivita-velo"></div>
        <div class="f04-attivita-titolo"><i>Settimana bianca</i><i>Corsi sci e snowboard</i><i class="f04-rientro">Gara sociale</i></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const DUR = 3.8;
        // ENTRA: i testi arrivano quando la tendina della scena nuova è quasi finita
        const ENTRA = 0.7;
        tl.fromTo("#f04-attivita-cam", { scale: 1.06 }, { scale: 1, duration: DUR, ease: "none" }, 0);
        // Le tre targhe a cascata
        gsap.utils.toArray(".f04-attivita-titolo i").forEach((el, i) => {
          tl.fromTo(el, { x: -140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, ENTRA + i * 0.28);
        });
        window.__timelines["f04-attivita"] = tl;
      </script>
    </template>
  </body>
</html>
