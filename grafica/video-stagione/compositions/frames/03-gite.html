<!doctype html>
<html lang="it">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("assets/fonts/barlow-condensed-800.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 600; src: url("assets/fonts/barlow-600.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/barlow-700.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Barlow Condensed", sans-serif; background: #06396a; }
        #f03-gite-cam { position: absolute; inset: 0; transform-origin: 50% 60%; }
        #f03-gite-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #f03-gite-velo { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 28, 52, 0) 32%, rgba(4, 28, 52, 0.55) 62%, rgba(4, 28, 52, 0.78) 100%); }
        .f03-gite-titolo { position: absolute; left: 64px; right: 64px; bottom: 400px; font-weight: 800; text-transform: uppercase;
          line-height: 0.9; letter-spacing: 0.005em; text-shadow: 0 6px 28px rgba(0, 0, 0, 0.5); }
        .f03-gite-titolo b { display: block; font-weight: 800; }
        .giallo { color: #FCCF02; }
        #f03-gite-a, #f03-gite-b { transform-origin: 0% 100%; }

      </style>
      <div id="root" data-composition-id="f03-gite" data-width="1080" data-height="1920">
        <div id="f03-gite-cam">
          <video id="f03-gite-v0" class="clip" src="assets/clip/verticali/funivia.mp4" muted playsinline data-start="0" data-duration="4.3" data-media-start="8.5" data-track-index="0"></video>
        </div>
        <div id="f03-gite-velo"></div>
        <div class="f03-gite-titolo"><b id="f03-gite-a" style="font-size:180px">Nuove gite</b><b id="f03-gite-b" class="giallo" style="font-size:180px">in arrivo</b></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const DUR = 4.3;
        // ENTRA: i testi arrivano quando la tendina della scena nuova è quasi finita
        const ENTRA = 0.7;
        tl.fromTo("#f03-gite-cam", { scale: 1 }, { scale: 1.07, duration: DUR, ease: "none" }, 0);
        tl.fromTo("#f03-gite-a", { y: 90, rotation: 5, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "circ.out" }, ENTRA);
        tl.fromTo("#f03-gite-b", { scale: 1.45, filter: "blur(14px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.55, ease: "power4.out" }, ENTRA + 0.45);
        window.__timelines["f03-gite"] = tl;
      </script>
    </template>
  </body>
</html>
