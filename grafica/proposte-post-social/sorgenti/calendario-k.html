<!doctype html>
<html lang="it" class="post">
<head>
<meta charset="utf-8">
<title>Calendario · K Piani</title>
<link rel="stylesheet" href="../../font/barlow/barlow.css">

<body>
<!-- Il calendario ha sei righe: la foto è più bassa (--fine) e la tessera, senza
     ora, conta le gite del mese. Nella finestra un'altra foto, per prova. -->
<div class="cv" style="--fine: 470px; --immagine: url(foto/gita-la-thuile.jpg); --fuoco: center 35%">
  <img class="foto" src="foto/calendario-montagna.jpg" alt="Montagna innevata">
  <div class="piano scuro"></div>
  <div class="piano angolo"></div>
  <div class="piano cuneo"></div>
  <div class="piano finestra"></div>
  <div class="piano ombra"></div>
  <div class="logo-box"><img src="../../logo/logo_sciclubdonbosco.svg" alt="Sci Club Don Bosco"></div>
  <div class="tessera" style="height: 450px"><span>gennaio</span><b>6</b><span>gite</span></div>
  <div class="testo">
    <div class="gancio">Le gite del mese</div>
    <h1>Calendario di gennaio</h1>
    <div class="righe">
      <div><span class="giorno dom">dom 10</span><span class="meta">Prato Nevoso</span><span class="corso">corso</span></div>
      <div><span class="giorno sab">sab 16</span><span class="meta">Sestriere</span></div>
      <div><span class="giorno dom">dom 17</span><span class="meta">La Thuile</span><span class="corso">corso</span></div>
      <div><span class="giorno sab">sab 23</span><span class="meta">Courmayeur</span></div>
      <div><span class="giorno dom">dom 24</span><span class="meta">Cervinia</span><span class="corso">corso</span></div>
      <div><span class="giorno dom">dom 31</span><span class="meta">Pila</span><span class="corso">corso</span></div>
    </div>
  </div>
  <div class="iscrizioni">Iscrizioni in negozio o via mail<b>sciclubdonboscoasti@gmail.com</b></div>
</div>
<script src="comune.js"></script>
</body>
