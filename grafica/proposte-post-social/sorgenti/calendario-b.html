<!doctype html>
<html lang="it" class="post">
<head>
<meta charset="utf-8">
<title>Calendario · B Calendario</title>
<link rel="stylesheet" href="../../font/barlow/barlow.css">
<link rel="stylesheet" href="comune.css">
<link rel="stylesheet" href="b.css">
<!-- Il calendario del mese: le gite in righe dentro il foglio a strappo, con la testata
     del mese. Senza la griglia dei giorni, che ripeteva le stesse date. -->
<style>
html { --cat: #FCCF02; --cat-ink: #06396A; }
.mese-intero { background: #fff; border-radius: 28px; box-shadow: 0 16px 40px rgba(0,0,0,.35); position: relative; padding-bottom: 18px; }
.mese-intero .mese { background: var(--cat); color: var(--cat-ink); font-size: 50px; font-weight: 800; text-align: center;
  border-radius: 28px 28px 0 0; padding: 26px 0 12px; }
.mese-intero .anello { position: absolute; top: -22px; width: 30px; height: 58px; border-radius: 15px; background: #D5DAE1; border: 5px solid #14202E; }
.righe { padding: 6px 28px 0; }
.righe div { display: flex; align-items: center; gap: 20px; padding: 13px 0; border-bottom: 2px solid #E4E6EB; }
.righe div:last-child { border-bottom: 0; }
.righe i { flex: none; font-style: normal; width: 210px; text-align: center; border-radius: 999px; font-size: 36px; font-weight: 800; padding: 6px 0; }
.righe .meta { font-size: 52px; font-weight: 700; line-height: 1.1; color: var(--testo); }
/* Il corso contornato, non pieno: il giallo dei corsi si confonderebbe con la domenica. */
.righe .corso { margin-left: auto; flex: none; font-size: 34px; font-weight: 800; color: var(--blu); border: 3px solid var(--blu); border-radius: 14px; padding: 2px 14px; }
.dom { background: #FCCF02; color: #06396A; } .sab { background: #084C8D; color: #fff; }
</style>
</head>
<body>
<div class="cv">
  <div class="neve" data-neve=".18"></div>
  <svg class="monti" viewBox="0 0 1080 330" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <polygon fill="#1D5E9E" points="0,150 160,60 300,120 470,20 610,110 770,10 910,100 1080,40 1080,330 0,330"/>
    <polygon fill="#0A4279" points="0,230 200,130 340,190 560,80 740,200 900,140 1080,210 1080,330 0,330"/>
    <polygon fill="#06396A" points="0,300 140,250 260,280 420,240 600,290 800,250 1080,295 1080,330 0,330"/>
  </svg>
  <div class="contenuto">
    <div class="testa">
      <div class="logo-box"><img src="../../logo/logo_sciclubdonbosco.svg" alt="Sci Club Don Bosco"></div>
    </div>
    <div class="titolo">Calendario di gennaio</div>
    <div class="mese-intero">
      <div class="anello" style="left:22%"></div><div class="anello" style="right:22%"></div>
      <div class="mese">Gennaio 2027</div>
      <div class="righe">
        <div><i class="dom">Dom 10/01</i><span class="meta">Prato Nevoso</span><span class="corso">Corso</span></div>
        <div><i class="sab">Sab 16/01</i><span class="meta">Sestriere</span></div>
        <div><i class="dom">Dom 17/01</i><span class="meta">La Thuile</span><span class="corso">Corso</span></div>
        <div><i class="sab">Sab 23/01</i><span class="meta">Courmayeur</span></div>
        <div><i class="dom">Dom 24/01</i><span class="meta">Cervinia</span><span class="corso">Corso</span></div>
        <div><i class="dom">Dom 31/01</i><span class="meta">Pila</span><span class="corso">Corso</span></div>
      </div>
    </div>
    <div class="iscrizioni">
      <svg viewBox="0 0 24 24" fill="#FCCF02" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3-8-5.3zM5.8 7 12 11.1 18.2 7H5.8z"/></svg>
      <div>Iscrizioni in negozio o via mail<b>sciclubdonboscoasti@gmail.com</b></div>
    </div>
  </div>
</div>
<script src="comune.js"></script>
</body>
</html>
