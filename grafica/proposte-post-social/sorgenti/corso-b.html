<!doctype html>
<html lang="it" class="post">
<head>
<meta charset="utf-8">
<title>B · Calendario</title>
<link rel="stylesheet" href="../../font/barlow/barlow.css">
<link rel="stylesheet" href="comune.css">
<style>
/* B · Calendario. Il messaggio è la data: un foglio di calendario a strappo
 * con il primo mercoledì, e sotto in una frase fino a quando dura. Fondo blu
 * del club con la neve e le montagne di Montagna, di sera. Le informazioni
 * sono quelle di A (orario e durata, palestra, fino a quando, per chi,
 * iscrizioni e mail): cambia solo come sono disegnate. */
html { --k: 1; }
html.story { --k: 1.02; }
.cv { background: var(--blu); }
.monti { position: absolute; left: 0; right: 0; bottom: 0; width: 1080px; height: 330px; }
html.story .monti { height: 520px; }
.contenuto { position: absolute; left: 60px; right: 60px; top: 56px; bottom: 60px;
  display: flex; flex-direction: column; gap: calc(34px * var(--k)); }
html.story .contenuto { top: 262px; bottom: 350px; justify-content: space-between; gap: 24px; }
/* Story: i testi piccoli a corpo fisso, per non scendere sotto i 44 px. */
html.story .dove .et, html.story .iscrizioni div { font-size: 44px; }
html.story .foglio .num { font-size: 220px; }
html.story .titolo { font-size: 110px; }
html.story .centro { padding-top: 22px; }
html.story .dove .chi { font-size: 48px; }
html.story .dove .nota { font-size: 44px; }
html.story .iscrizioni b { font-size: 46px; }

.testa { display: flex; justify-content: space-between; align-items: flex-start; }
.testa .logo-box { border-radius: 22px; padding: 12px 18px; }
.testa .logo-box img { height: calc(150px * var(--k)); }

.titolo { color: #fff; font-size: calc(108px * var(--k)); font-weight: 800; letter-spacing: -.035em; line-height: .95; }
/* Come negli altri post di B: titolo alto due righe. */
html.post .titolo { font-size: 104px; min-height: calc(2 * .95 * 104px); }

.centro { display: flex; gap: calc(44px * var(--k)); align-items: center; }
/* Il foglio: testata gialla (il colore dei corsi), due anelli, il giorno grande. */
.foglio { flex: none; width: calc(430px * var(--k)); background: #fff; border-radius: 28px; text-align: center;
  position: relative; box-shadow: 0 16px 40px rgba(0,0,0,.35); transform: rotate(-2deg); }
.foglio .mese { background: var(--giallo); color: var(--blu); font-size: calc(46px * var(--k)); font-weight: 800;
  border-radius: 28px 28px 0 0; padding: calc(30px * var(--k)) 0 calc(14px * var(--k)); letter-spacing: -.01em; }
.foglio .anello { position: absolute; top: calc(-22px * var(--k)); width: calc(30px * var(--k)); height: calc(58px * var(--k));
  border-radius: 15px; background: #D5DAE1; border: 5px solid #14202E; }
.foglio .giorno { font-size: calc(48px * var(--k)); font-weight: 700; margin-top: calc(18px * var(--k)); }
.foglio .num { font-size: calc(250px * var(--k)); font-weight: 800; line-height: .82; letter-spacing: -.05em; color: var(--blu); margin-top: calc(6px * var(--k)); }
.foglio .ora { font-size: calc(58px * var(--k)); font-weight: 800; padding: calc(14px * var(--k)) 0 calc(28px * var(--k)); }
.dove { color: #fff; min-width: 0; }
.dove .et { color: #fff; font-size: calc(38px * var(--k)); font-weight: 600; }
.dove .luogo { font-size: calc(56px * var(--k)); font-weight: 800; line-height: 1; letter-spacing: -.025em; margin-top: 8px; }
.dove .nota { font-size: calc(40px * var(--k)); font-weight: 600; margin-top: 8px; line-height: 1.2; color: #fff; }
.dove .chi { font-size: calc(56px * var(--k)); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; margin-top: 8px; }
.dove .et + .et, .dove .nota + .et { margin-top: calc(26px * var(--k)); }

/* Fino a quando dura: una frase sola, senza date di pausa. */
.durata { background: var(--giallo); border-radius: 28px; padding: calc(30px * var(--k)) 40px; color: var(--blu);
  box-shadow: 0 12px 30px rgba(0,0,0,.3); }
.durata .frase { font-size: calc(54px * var(--k)); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.durata .frase em { font-style: normal; }

/* Iscrizioni e mail, come in fondo al biglietto di A. */
/* Iscrizioni in un riquadro bianco, più grandi: si devono vedere. */
.iscrizioni { margin-top: auto; display: flex; gap: 24px; align-items: center; background: #fff; color: var(--blu);
  border-radius: 28px; padding: 20px 32px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.iscrizioni svg { flex: none; width: 72px; height: 72px; }
.iscrizioni div { font-size: 40px; font-weight: 600; line-height: 1.2; }
.iscrizioni b { display: block; font-size: 48px; font-weight: 800; color: var(--blu); letter-spacing: -.02em; }
</style>
</head>
<body>
<div class="cv">
  <div class="neve" data-neve=".18"></div>
  <!-- Montagne di sera, dal paesaggio di Montagna. -->
  <svg class="monti" viewBox="0 0 1080 330" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <polygon fill="#fff" fill-opacity=".07" points="0,150 160,60 300,120 470,20 610,110 770,10 910,100 1080,40 1080,330 0,330"/>
    <polygon fill="#fff" fill-opacity=".11" points="0,230 200,130 340,190 560,80 740,200 900,140 1080,210 1080,330 0,330"/>
    <polygon fill="#fff" fill-opacity=".16" points="0,300 140,250 260,280 420,240 600,290 800,250 1080,295 1080,330 0,330"/>
  </svg>
  <div class="contenuto">
    <div class="testa">
      <div class="logo-box"><img src="../../logo/logo_sciclubdonbosco.svg" alt="Sci Club Don Bosco"></div>
    </div>
    <div class="titolo">Ginnastica presciistica</div>
    <div class="centro">
      <div class="foglio">
        <div class="anello" style="left:26%"></div><div class="anello" style="right:26%"></div>
        <div class="mese">Ottobre</div>
        <div class="giorno">Mercoledì</div>
        <div class="num">21</div>
        <div class="ora">ore 19:30</div>
      </div>
      <div class="dove">
        <div class="et">Dove</div>
        <div class="luogo">Palestra Way&nbsp;Assauto</div>
        <div class="luogo">Asti</div>
        <div class="nota">Lezioni di un'ora</div>
        <div class="et">Per chi</div>
        <div class="chi">Soci tesserati e assicurati</div>
      </div>
    </div>
    <div class="durata">
      <div class="frase">Tutti i <em>mercoledì</em> <span style="white-space:nowrap">fino al 13 gennaio</span></div>
    </div>
    <div class="iscrizioni">
      <svg viewBox="0 0 24 24" fill="#084C8D" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3-8-5.3zM5.8 7 12 11.1 18.2 7H5.8z"/></svg>
      <div>Iscrizioni in negozio o via mail<b>sciclubdonboscoasti@gmail.com</b></div>
    </div>
  </div>
</div>
<script src="comune.js"></script>
</body>
</html>
