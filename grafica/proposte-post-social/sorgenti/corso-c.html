<!doctype html>
<html lang="it" class="post">
<head>
<meta charset="utf-8">
<title>C · Divano</title>
<link rel="stylesheet" href="../../font/barlow/barlow.css">
<link rel="stylesheet" href="comune.css">
<style>
/* Sul giallo il bianco trasparente si vede meno che sul blu: montagne più opache. */
html { --monti-1: .34; --monti-2: .5; }
/* C · Divano. Manifesto: la prima riga della mail ("Alzati dal divano")
 * diventa il titolo, enorme, sul giallo del logo; un divano rimasto vuoto con
 * gli sci appoggiati. Le informazioni sono quelle di A (orario e durata,
 * palestra, fino a quando, per chi, iscrizioni e mail): il divano si stringe
 * per fare posto. Sul giallo si scrive solo blu scuro (brand-guidelines §1),
 * il logo sta su bianco (§3). */
.cv { background: var(--giallo); color: var(--blu); }
.contenuto { position: absolute; left: 64px; right: 64px; top: 56px; bottom: 56px; display: flex; flex-direction: column; }
html.story .contenuto { top: 262px; bottom: 352px; }

.testa { flex: none; display: flex; justify-content: space-between; align-items: flex-start; }
.testa .logo-box { border-radius: 22px; padding: 12px 18px; }
.testa .logo-box img { height: 150px; }

/* Nel post, altezze fisse come negli altri post di C: la fascia e il testo sotto stanno
 * sempre nello stesso punto. */
.gancio { flex: none; height: 270px; font-size: 150px; font-weight: 800; letter-spacing: -.045em; line-height: .9; margin-top: 28px; }
html.story .gancio { height: auto; }
html.story .gancio { font-size: 150px; margin-top: 44px; }

.scena { flex: 1 1 0; min-height: 0; position: relative; z-index: 1; margin-bottom: -14px; }
html.post .scena { flex: none; height: 150px; }
/* Montagne stilizzate dietro il disegno e la fascia, come negli altri post di C. */
.monti { position: absolute; left: 0; top: 380px; width: 1080px; height: 400px; pointer-events: none; }
html.story .monti { top: 560px; }
.scena svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.nastro { flex: none; position: relative; z-index: 2; margin: 0 -110px; background: var(--blu); color: #fff;
  transform: rotate(-2deg); text-align: center; font-size: 72px; font-weight: 800; letter-spacing: -.03em; padding: 16px 0 22px; white-space: nowrap;
  box-shadow: 0 10px 24px rgba(6,57,106,.3); }
html.story .nastro { font-size: 88px; }

.info { flex: 1 1 auto; }
.info .quando { font-size: 58px; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
.info .dove { font-size: 46px; font-weight: 700; margin-top: 8px; line-height: 1.15; }
.info .poi { font-size: 40px; font-weight: 600; margin-top: 8px; line-height: 1.2; }
/* Orari e date evidenziati come col pennarello, come negli altri post di C. */

/* Iscrizioni e mail, come in fondo al biglietto di A. */
/* Come negli altri post di C: sotto la fascia un riquadro bianco: gancio e dati in
 * blu, orari/prezzi/scadenze in un riquadrino blu con la scritta gialla (5,8:1), in
 * fondo le iscrizioni dopo un filo. Si legge sul giallo e sul blu allo stesso modo. */
.scheda { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; margin-top: 34px;
  background: #fff; color: var(--blu); border-radius: 28px; padding: 22px 32px 18px; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
.scheda .info, .scheda .righe { flex: 1 1 auto; margin-top: 0; }
.info b { font-weight: 800; background: var(--blu); color: var(--giallo); padding: 0 .16em; border-radius: .14em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.iscrizioni { flex: none; display: flex; gap: 24px; align-items: center; margin-top: 14px; padding-top: 14px;
  border-top: 3px solid var(--filo); }
.iscrizioni svg { flex: none; width: 72px; height: 72px; }
.iscrizioni div { font-size: 40px; font-weight: 600; line-height: 1.2; }
.iscrizioni b { display: block; font-size: 48px; font-weight: 800; letter-spacing: -.02em; }
html.story .scheda { flex: none; margin-top: 44px; }
html.story .info .quando { font-size: 66px; }
html.story .info .dove { font-size: 56px; }
html.story .info .poi { font-size: 46px; }
html.story .iscrizioni div { font-size: 44px; }
html.story .iscrizioni b { font-size: 48px; }
html.story .iscrizioni svg { width: 70px; height: 70px; }
</style>
</head>
<body>
<div class="cv">
  <!-- Sfondo uguale in tutti i post di C: fiocchi e montagne stilizzate, in bianco
       trasparente (un solo blu e un solo giallo). -->
  <div class="neve" data-neve=".7"></div>
  <svg class="monti" viewBox="0 0 1080 400" preserveAspectRatio="none" aria-hidden="true">
    <polygon fill="#fff" style="fill-opacity: var(--monti-1, .16)" points="0,250 150,140 270,200 430,60 570,180 710,100 870,210 1080,110 1080,400 0,400"/>
    <polygon fill="#fff" style="fill-opacity: var(--monti-2, .24)" points="0,330 180,225 330,295 520,180 700,295 880,230 1080,305 1080,400 0,400"/>
  </svg>
  <div class="contenuto">
    <div class="testa">
      <div class="logo-box"><img src="../../logo/logo_sciclubdonbosco.svg" alt="Sci Club Don Bosco"></div>
    </div>
    <div class="gancio">Ginnastica<br>presciistica</div>
    <div class="scena">
      <!-- Il divano vuoto e gli sci appoggiati. -->
      <svg viewBox="0 0 780 370" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <ellipse cx="350" cy="352" rx="330" ry="14" fill="#084C8D" opacity=".18"/>
        <rect x="72" y="300" width="28" height="48" rx="6" fill="#14202E"/>
        <rect x="560" y="300" width="28" height="48" rx="6" fill="#14202E"/>
        <rect x="80" y="56" width="500" height="196" rx="50" fill="#084C8D"/>
        <rect x="118" y="86" width="206" height="118" rx="38" fill="#fff" fill-opacity=".16"/>
        <rect x="336" y="86" width="206" height="118" rx="38" fill="#fff" fill-opacity=".16"/>
        <rect x="40" y="222" width="580" height="92" rx="28" fill="#084C8D"/>
        <rect x="112" y="186" width="214" height="70" rx="26" fill="#fff" fill-opacity=".28"/>
        <rect x="334" y="186" width="214" height="70" rx="26" fill="#fff" fill-opacity=".28"/>
        <rect x="18" y="138" width="104" height="176" rx="48" fill="#084C8D"/>
        <rect x="538" y="138" width="104" height="176" rx="48" fill="#084C8D"/>
        <!-- Il telecomando lasciato sul cuscino: qualcuno si è appena alzato. -->
        <g transform="rotate(-10 215 205)">
          <rect x="160" y="190" width="110" height="30" rx="12" fill="#14202E"/>
          <circle cx="182" cy="205" r="7" fill="#B3261E"/><circle cx="208" cy="205" r="5" fill="#fff"/><circle cx="228" cy="205" r="5" fill="#fff"/><circle cx="248" cy="205" r="5" fill="#fff"/>
        </g>
        <!-- Sci e bastoncini appoggiati al bracciolo. -->
        <g transform="rotate(-9 700 350)">
          <line x1="752" y1="350" x2="752" y2="40" stroke="#14202E" stroke-width="9" stroke-linecap="round"/>
          <circle cx="752" cy="318" r="15" fill="none" stroke="#14202E" stroke-width="6"/>
          <rect x="743" y="30" width="18" height="46" rx="8" fill="#14202E"/>
          <rect x="650" y="16" width="36" height="336" rx="18" fill="#B3261E"/>
          <rect x="694" y="8" width="36" height="344" rx="18" fill="#B3261E"/>
          <rect x="650" y="16" width="36" height="46" rx="18" fill="#fff"/>
          <rect x="694" y="8" width="36" height="46" rx="18" fill="#fff"/>
          <rect x="646" y="190" width="44" height="34" rx="8" fill="#14202E"/>
          <rect x="690" y="186" width="44" height="34" rx="8" fill="#14202E"/>
        </g>
      </svg>
    </div>
    <div class="nastro">Mercoledì 21 ottobre</div>
    <div class="scheda">
      <div class="info">
        <div class="quando">Alzati dal divano!</div>
        <div class="dove"><b>Ore 19:30</b> · Palestra Way Assauto, Asti</div>
        <div class="poi">Poi tutti i mercoledì fino al <b>13 gennaio</b></div>
        <div class="poi">Lezioni di un'ora · soci tesserati e assicurati</div>
      </div>
      <div class="iscrizioni">
        <svg viewBox="0 0 24 24" fill="#084C8D" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3-8-5.3zM5.8 7 12 11.1 18.2 7H5.8z"/></svg>
        <div>Iscrizioni in negozio o via mail<b>sciclubdonboscoasti@gmail.com</b></div>
      </div>
    </div>
  </div>
</div>
<script src="comune.js"></script>
</body>
</html>
