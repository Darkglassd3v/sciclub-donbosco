<!doctype html>
<!-- Storie della serata del 25/11 in stile GTA (richieste del 24/11/2026: «modalità GTA 6», «solo la foto della
     montagna frontale e sullo sfondo le palme stile Miami al tramonto», «il font di GTA», poi «palme fatte bene» come
     nella copertina del gioco): cielo al tramonto morbido, lavanda in alto, rosa e pesca in basso, con nuvole
     sfumate; palme in controluce viola semitrasparente su tre piani, disegnate qui in SVG con le foglie piumate
     (ogni fronda ha le sue foglioline); al centro la foto del Monte Bianco. Solo l'atmosfera del genere: niente
     logo né scritte del gioco; il logo è quello tondo ufficiale del club.
     Il carattere delle scritte grandi è Pricedown (Typodermic Fonts, raccolta gratuita), installato fuori dal
     repository: la licenza desktop permette le immagini ma non di ridistribuire il font; senza, la pagina lo
     segnala nel titolo.
     Pagine: #domani (storia del 24/11) e #stasera (storia del 25/11). Quando caratteri e foto sono pronti il titolo
     dice «PRONTO [...]» con i problemi trovati. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Storie GTA</title>
  <link rel="stylesheet" href="../../font/barlow/barlow.css">
  <style>
    html, body { margin: 0; overflow: hidden; }
    .storia { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff; font-family: Barlow, sans-serif;
      background: linear-gradient(180deg, #5d5a9c 0, #7c6aa8 300px, #a777ac 650px, #d38aa6 950px, #ee9f98 1200px,
                                          #f7b48a 1450px, #fbc985 1700px, #fcd28a 1920px); }
    /* Nuvole sfilacciate, illuminate dal basso. */
    .nuvola { position: absolute; border-radius: 50%; filter: blur(18px); }
    .palme { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

    /* Due foto di sbieco (richiesta del 24/11): il Monte Bianco e il gruppo, con la cornice al neon rosa e azzurra. */
    .foto { position: absolute; z-index: 3; border-radius: 18px; overflow: hidden; border: 6px solid #fff; }
    .foto img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(1.3) contrast(1.05); }
    .foto.monte { left: 50px; top: 420px; width: 600px; height: 390px; transform: rotate(-6deg);
      box-shadow: 0 0 0 5px #ff3fa4, 0 0 34px 10px rgba(255, 63, 164, .8), 0 0 90px 24px rgba(255, 63, 164, .35); }
    .foto.gruppo { left: 420px; top: 590px; width: 610px; height: 400px; transform: rotate(5deg); z-index: 4;
      box-shadow: 0 0 0 5px #35e8ff, 0 0 34px 10px rgba(53, 232, 255, .8), 0 0 90px 24px rgba(53, 232, 255, .35); }
    .foto::after { content: ""; position: absolute; inset: 0; mix-blend-mode: soft-light;
      background: linear-gradient(180deg, rgba(180, 110, 220, .5), rgba(255, 140, 120, .5)); }

    #logo { position: absolute; left: 50%; top: 160px; width: 210px; height: 210px; transform: translateX(-50%); z-index: 6;
      border-radius: 50%; box-shadow: 0 0 0 5px #fff, 0 0 0 10px #ff3fa4, 0 0 40px 14px rgba(255, 63, 164, .7), 0 0 90px 30px rgba(53, 232, 255, .35); }

    /* Scritte: Pricedown bianco col bordo viola scuro, come le scritte del gioco; le informazioni in riquadri
     * velati col bordo bianco, che si leggono anche sul pesca del tramonto. */
    .testi { position: absolute; left: 60px; right: 60px; top: 1040px; z-index: 7; text-align: center; }
    .grande { font: 900 190px/0.9 Pricedown, sans-serif; letter-spacing: .01em; color: #fff;
      -webkit-text-stroke: 8px #2d1846; paint-order: stroke fill;
      text-shadow: 0 0 18px #ff3fa4, 0 0 42px rgba(255, 63, 164, .85), 0 12px 30px rgba(45, 24, 70, .55); }
    .ora { margin-top: 4px; font: 900 112px/1 Pricedown, sans-serif; letter-spacing: .02em;
      background: linear-gradient(180deg, #ffe7a3 0%, #ffb36b 55%, #ff6f91 100%); -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-stroke: 6px #2d1846; paint-order: stroke fill;
      filter: drop-shadow(0 0 14px rgba(53, 232, 255, .95)) drop-shadow(0 10px 22px rgba(45, 24, 70, .5)); }
    .riquadro { display: inline-block; margin-top: 22px; padding: 14px 30px; border: 3px solid #35e8ff; border-radius: 16px;
      background: rgba(48, 18, 82, .7); box-shadow: 0 0 22px 4px rgba(53, 232, 255, .65), inset 0 0 18px rgba(53, 232, 255, .3); }
    .riquadro.info { border-color: #ff3fa4; box-shadow: 0 0 22px 4px rgba(255, 63, 164, .65), inset 0 0 18px rgba(255, 63, 164, .3); }
    .titolo { font: 900 46px/1.1 Pricedown, sans-serif; letter-spacing: .03em; }
    .info { font-size: 40px; font-weight: 700; line-height: 1.25; }
    .info b { font-weight: 800; color: #ffe08a; }
    .spaziato { margin-top: 26px; font: 800 34px/1 Barlow, sans-serif; letter-spacing: .3em; text-transform: uppercase;
      font-weight: 800; color: #fff; -webkit-text-stroke: 5px #2d1846; paint-order: stroke fill;
      text-shadow: 0 0 14px #ff3fa4, 0 0 30px rgba(255, 63, 164, .8); }
  </style>
</head>
<body>
  <script>
    // Numeri pseudo-casuali ripetibili: le palme escono sempre uguali a ogni render.
    let seme = 7;
    const caso = () => { seme = (seme * 16807) % 2147483647; return (seme - 1) / 2147483646; };
    const f = (n) => n.toFixed(1);

    /**
     * Una palma in controluce. Il tronco è un nastro curvo che si assottiglia; la chioma ha `fronde` foglie piumate:
     * ogni foglia è una nervatura che esce dalla cima e ricade per il peso, con le foglioline su entrambi i lati,
     * lunghe a metà e corte verso la punta, inclinate verso il basso come nelle palme vere.
     */
    function palma({ x, y, altezza, piega, chioma, fronde = 11, colore, opacita }) {
      const cx = x + piega, cy = y - altezza;
      const base = Math.max(7, altezza * 0.013), cima = base * 0.6;
      // Tronco: nastro con una leggera curva a S, più largo alla base.
      const k1x = x + piega * 0.05, k1y = y - altezza * 0.35, k2x = x + piega * 0.6, k2y = y - altezza * 0.75;
      let d = `M${f(x - base)} ${f(y)} C${f(k1x - base)} ${f(k1y)} ${f(k2x - cima)} ${f(k2y)} ${f(cx - cima)} ${f(cy)}`
        + ` L${f(cx + cima)} ${f(cy)} C${f(k2x + cima)} ${f(k2y)} ${f(k1x + base)} ${f(k1y)} ${f(x + base)} ${f(y)} Z`;
      // Il ciuffo al centro della chioma.
      d += ` M${f(cx)} ${f(cy - chioma * 0.08)} a${f(chioma * 0.07)} ${f(chioma * 0.09)} 0 1 0 0.1 0 Z`;
      let foglie = "";
      for (let i = 0; i < fronde; i++) {
        // Direzioni di partenza a ventaglio sopra la cima (da -168° a -12°), più qualche fronda che pende sotto.
        const sotto = i % 5 === 4;
        const gradi = sotto ? (i % 2 ? 35 + caso() * 25 : 145 - caso() * 25) : -168 + (156 * i) / (fronde - 1) + (caso() - 0.5) * 10;
        const a = (gradi * Math.PI) / 180, h = Math.cos(a), v = Math.sin(a);
        const L = chioma * (sotto ? 0.75 : 0.85 + 0.3 * Math.abs(h)) * (0.9 + caso() * 0.2);
        // La nervatura sale nella sua direzione e poi ricade ad arco: la punta finisce più in basso della partenza.
        const qx = cx + h * L * 0.55, qy = cy + v * L * 0.55 - L * 0.1;
        const ex = cx + h * L * (0.95 + 0.1 * Math.abs(v)) + (Math.abs(h) < 0.35 ? Math.sign(h || 1) * L * 0.35 : 0);
        const ey = cy + v * L * 0.25 + L * (sotto ? 0.6 : 0.35 + 0.3 * Math.abs(h));
        const sp = Math.max(2, chioma * 0.012);
        d += ` M${f(cx)} ${f(cy - sp)} Q${f(qx)} ${f(qy - sp)} ${f(ex)} ${f(ey)} Q${f(qx)} ${f(qy + sp)} ${f(cx)} ${f(cy + sp)} Z`;
        // Foglioline: strette e appuntite, pendono verso il basso e un po' in fuori, lunghe a metà fronda.
        const passi = Math.round(L / 17);
        for (let k = 2; k <= passi; k++) {
          const t = k / passi, u = 1 - t;
          if (caso() < 0.18) continue;   // qualche fogliolina manca: il profilo resta frastagliato
          const px = u * u * cx + 2 * u * t * qx + t * t * ex, py = u * u * cy + 2 * u * t * qy + t * t * ey;
          const tx = 2 * u * (qx - cx) + 2 * t * (ex - qx), ty = 2 * u * (qy - cy) + 2 * t * (ey - qy);
          const n = Math.hypot(tx, ty) || 1, dx = tx / n, dy = ty / n;
          const lung = chioma * 0.26 * Math.pow(Math.sin(Math.PI * (0.15 + 0.85 * t)), 0.9) * (0.75 + caso() * 0.5);
          for (const s of [-1, 1]) {
            let lx = -dy * s * 0.75 + dx * 0.45, ly = dx * s * 0.75 + dy * 0.45 + 0.55;
            const m = Math.hypot(lx, ly); lx /= m; ly /= m;
            const w = sp * 0.75, nx = -ly * w, ny = lx * w;
            // Punta un po' piegata verso il basso.
            const mx = px + lx * lung * 0.55, my = py + ly * lung * 0.55;
            foglie += `M${f(px - nx)} ${f(py - ny)}Q${f(mx - nx * 0.6)} ${f(my - ny * 0.6)} ${f(px + lx * lung)} ${f(py + ly * lung + lung * 0.12)}`
              + `Q${f(mx + nx * 0.6)} ${f(my + ny * 0.6)} ${f(px + nx)} ${f(py + ny)}Z`;
          }
        }
      }
      return `<g opacity="${opacita}" fill="${colore}"><path d="${d}"/><path d="${foglie}"/></g>`;
    }

    const VIOLA_VICINO = "#4a2c6b", VIOLA_MEDIO = "#6a4688", VIOLA_LONTANO = "#8d68a6";
    const PALME = `<svg class="palme" viewBox="0 0 1080 1920" aria-hidden="true">
      ${palma({ x: 150, y: 1960, altezza: 900, piega: 40, chioma: 210, colore: VIOLA_LONTANO, opacita: .45 })}
      ${palma({ x: 930, y: 1960, altezza: 560, piega: -30, chioma: 170, colore: VIOLA_LONTANO, opacita: .45 })}
      ${palma({ x: 1010, y: 1960, altezza: 430, piega: -10, chioma: 150, colore: VIOLA_MEDIO, opacita: .6 })}
      ${palma({ x: 60, y: 1960, altezza: 1250, piega: 70, chioma: 300, colore: VIOLA_MEDIO, opacita: .7 })}
      ${palma({ x: 1060, y: 1960, altezza: 1650, piega: -110, chioma: 380, fronde: 13, colore: VIOLA_VICINO, opacita: .82 })}
      ${palma({ x: -20, y: 1960, altezza: 1720, piega: 60, chioma: 330, fronde: 12, colore: VIOLA_VICINO, opacita: .85 })}
      <g fill="none" stroke="#5a3a78" stroke-width="3" stroke-linecap="round" opacity=".8">
        <path d="M760 1280 q12 -10 24 0 q12 -10 24 0"/><path d="M820 1310 q9 -8 18 0 q9 -8 18 0"/></g>
    </svg>`;
    const NUVOLE = [[80, 980, 520, 40, "rgba(255,190,170,.45)"], [520, 1120, 460, 34, "rgba(255,200,160,.4)"],
                    [200, 1380, 640, 46, "rgba(255,215,170,.45)"], [600, 300, 380, 30, "rgba(200,170,230,.35)"]]
      .map(([x, y, w, h, c]) => `<div class="nuvola" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c}"></div>`).join("");

    const storia = (quando) => `<div class="storia">
      ${NUVOLE}${PALME}
      <div class="foto monte"><img src="foto-monte-bianco.jpg" alt="" style="object-position: 70% 30%"></div>
      <div class="foto gruppo"><img src="../../volantino/FOTO COPERTINA.JPG" alt="" style="object-position: 48% 55%"></div>
      <img id="logo" src="../../../web/logo-ufficiale-blu-tondo.svg" alt="Sci Club Don Bosco Asti">
      <div class="testi">
        <div class="grande">${quando}</div>
        <div class="ora">alle 21</div>
        <div class="riquadro titolo">Presentazione della stagione 2026/27</div>
        <div class="riquadro info">Mercoledì <b>25 novembre</b> · ore <b>21:00</b><br>Circolo Way Assauto, corso Pietro Chiesa 20, Asti</div>
        <div class="spaziato">Buffet e brindisi finale</div>
      </div>
    </div>`;
    const PAGINE = { domani: () => storia("Domani"), stasera: () => storia("Stasera") };
    const nome = location.hash.slice(1) || "domani";
    document.body.insertAdjacentHTML("afterbegin", (PAGINE[nome] || (() => "<p>Pagina sconosciuta</p>"))());
    window.addEventListener("load", () => document.fonts.ready.then(() => {
      const problemi = [];
      if (!PAGINE[nome]) problemi.push(`pagina sconosciuta: ${nome}`);
      if (!document.fonts.check("100px Pricedown")) problemi.push("manca il font Pricedown (vedi il commento in testa)");
      for (const img of document.images) if (!img.complete || !img.naturalWidth) problemi.push(`immagine mancante: ${img.getAttribute("src")}`);
      // Niente testo nella fascia in basso coperta da Instagram (le risposte).
      const box = document.querySelector(".testi").getBoundingClientRect();
      if (box.bottom > 1920 - 230) problemi.push(`testi troppo in basso: ${Math.round(box.bottom)}`);
      for (const el of document.querySelectorAll(".testi > *")) {
        const r = el.getBoundingClientRect();
        if (r.width && (r.left < 40 || r.right > 1040)) problemi.push(`testo fuori: ${el.className} ${Math.round(r.left)}–${Math.round(r.right)}`);
      }
      document.title = `PRONTO ${JSON.stringify(problemi)}`;
    }));
  </script>
</body>
</html>
